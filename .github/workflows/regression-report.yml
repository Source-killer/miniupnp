---
name: 'miniupnpd: Regression report'

# Posts the result of a regression-testing.yml run on its pull request, as one review
# (event COMMENT): the regressions and improvements of each comparison, from the
# review-* artifact of each comparison job (its review.md alone, not the logs). The
# comparisons without a change share one line.
#
# A separate workflow, as the run of a fork's pull request has a read-only token. This
# one runs master's copy with a write token and runs no code of the pull request: it
# reads the artifacts as data and checks the pull request's head is the tested commit.
# The run is skipped for a push to master and for a cancelled run (a newer push of the
# pull request has its own run).

'on':
  workflow_run:
    workflows: ['miniupnpd: Regression testing']
    types: [completed]

permissions: {}

jobs:
  review:
    name: Post the regression report on the pull request
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download the pull request number
        uses: actions/download-artifact@v8
        with:
          name: pull-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts/pull-request

      - name: Download each comparison's review.md
        uses: actions/download-artifact@v8
        with:
          pattern: review-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          number=$(cat artifacts/pull-request/pull-request-number)
          if ! printf '%s\n' "$number" | grep -qxE '[0-9]+'; then
            echo "::error::no pull request number in the run's artifacts"
            exit 1
          fi
          pr_head=$(gh api "repos/$REPOSITORY/pulls/$number" --jq .head.sha)
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "pull request #$number moved on to $pr_head; its own run reports that commit"
            exit 0
          fi
          python3 - <<'EOF' > body.md
          import os, re
          from pathlib import Path

          # artifacts/review-<module>-<platform>/review.md: empty when nothing changed, else the
          # counts on the first line ("Regressions: N. Improvements: M." or "Incomplete
          # comparison.") and the tool's <details> boxes
          modules = {}
          for path in sorted(Path('artifacts').glob('review-*/review.md')):
              name = path.parent.name[len('review-'):]
              for os_name in ('linux', 'freebsd', 'openbsd'):    # upnp-wire-linux: upnp-wire, linux
                  if f'-{os_name}' in name:
                      module, platform = name.split(f'-{os_name}', 1)
                      platform = os_name + platform
                      break
              modules.setdefault(module, []).append((platform, path.read_text()))

          def counts(text):
              found = re.match(r'Regressions: (\d+)\. Improvements: (\d+)\.', text)
              return (int(found[1]), int(found[2])) if found else (None, None)

          def summary(regressions, improvements):
              if regressions is None:
                  return 'incomplete comparison'
              if not regressions and not improvements:
                  return 'no changes'
              return f'{regressions} regressions, {improvements} improvements'

          def body(full):
              out = [f"## Regression testing: {os.environ['CONCLUSION']}", '',
                     f"Master's daemon against `{os.environ['HEAD_SHA'][:12]}`. Full tables, logs and "
                     f"captures: [the run]({os.environ['RUN_URL']}).", '']
              for module, platforms in sorted(modules.items()):
                  changed = [(platform, text) for platform, text in platforms if text.strip()]
                  clean = [platform for platform, text in platforms if not text.strip()]
                  totals = [counts(text) for _, text in changed]
                  incomplete = any(r is None for r, _ in totals)
                  regressions = sum(r for r, _ in totals if r is not None)
                  improvements = sum(i for r, i in totals if r is not None)
                  out += ['<details open>' if incomplete or regressions else '<details>',
                          f'<summary><b>{module}</b>: {"incomplete comparison" if incomplete else summary(regressions, improvements)}</summary>',
                          '']
                  if clean:
                      out += [f'No changes: {", ".join(clean)}.', '']
                  for platform, text in changed:
                      r, i = counts(text)
                      out += ['<details open>' if r is None or r else '<details>',
                              f'<summary>{platform}: {summary(r, i)}</summary>', '',
                              (text.split('\n', 2)[2] if r is not None else text) if full
                              else '(Too long for a review: see the run.)', '', '</details>', '']
                  out += ['</details>', '']
              return '\n'.join(out)

          text = body(True)
          # a review body holds at most 65536 characters
          print(text if len(text) < 60000 else body(False))
          EOF
          gh api --method POST "repos/$REPOSITORY/pulls/$number/reviews" \
            -f commit_id="$HEAD_SHA" -f event=COMMENT -F body=@body.md
