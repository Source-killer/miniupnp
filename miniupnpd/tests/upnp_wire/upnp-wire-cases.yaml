        description: "The SCPD gives AddPinhole its arguments, in order."
        steps:
          - {"kind": "http", "path": "/WANIP6FC.xml", "parse": "scpd", "expect": {"scpd.args.AddPinhole": ["RemoteHost", "RemotePort", "InternalClient", "InternalPort", "Protocol", "LeaseTime", "UniqueID"], "scpd.directions.AddPinhole": ["in", "in", "in", "in", "in", "in", "out"]}}
      - name: 6fc1-2.6.4-must-updatepinhole-unknown
        # spec gap: answers 501 Action Failed for an unknown UniqueID
        ref: "6FC1 §2.6.4"
        builds: [igd2]
        families: [ipv6]
        description: UpdatePinhole of an unknown UniqueID gets 704 NoSuchEntry.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: UpdatePinhole, args: {UniqueID: 65000, NewLeaseTime: 3600},
             expect: {status: 500, fault: 704}}
      - name: 6fc1-2.6.4-must-scpd-updatepinhole
        ref: "6FC1 §2.6.4"
        builds: ["igd2"]
        description: "The SCPD gives UpdatePinhole its arguments, in order."
        steps:
          - {"kind": "http", "path": "/WANIP6FC.xml", "parse": "scpd", "expect": {"scpd.args.UpdatePinhole": ["UniqueID", "NewLeaseTime"], "scpd.directions.UpdatePinhole": ["in", "in"]}}
      - name: 6fc1-2.6.5-must-deletepinhole-twice
        # spec gap: answers 501 Action Failed for the deleted UniqueID
        ref: "6FC1 §2.6.5"
        builds: [igd2]
        families: [ipv6]
        description: After DeletePinhole the UniqueID is unknown, and a second DeletePinhole gets 704 NoSuchEntry.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole, args: {<<: *pinhole_args, InternalPort: 44010},
             capture: {id: out.UniqueID}, expect: {status: 200}}
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: $id}, expect: {status: 200}}
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: $id},
             expect: {status: 500, fault: 704}}
        cleanup:
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: $id}}
      - name: 6fc1-2.6.5-must-deletepinhole-unknown
        # spec gap: answers 501 Action Failed for an unknown UniqueID
        ref: "6FC1 §2.6.5"
        builds: [igd2]
        families: [ipv6]
        description: DeletePinhole of an unknown UniqueID gets 704 NoSuchEntry.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: 65000},
             expect: {status: 500, fault: 704}}
      - name: 6fc1-2.6.5-must-uniqueid-value-1
        ref: "6FC1 §2.6.5"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "A UniqueID of '-1' is refused."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "DeletePinhole", "args": {"UniqueID": "-1"}, "expect": {"status": 500}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: 6fc1-2.6.5-must-uniqueid-value-65536
        ref: "6FC1 §2.6.5"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "A UniqueID of '65536' is refused."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "DeletePinhole", "args": {"UniqueID": "65536"}, "expect": {"status": 500}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: 6fc1-2.6.5-must-uniqueid-value-abc
        ref: "6FC1 §2.6.5"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "A UniqueID of 'abc' is refused."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "DeletePinhole", "args": {"UniqueID": "abc"}, "expect": {"status": 500}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: 6fc1-2.6.5-must-uniqueid-value-empty
        ref: "6FC1 §2.6.5"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "A UniqueID of '' is refused."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "DeletePinhole", "args": {"UniqueID": ""}, "expect": {"status": 500}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: 6fc1-2.6.5-must-scpd-deletepinhole
        ref: "6FC1 §2.6.5"
        builds: ["igd2"]
        description: "The SCPD gives DeletePinhole its arguments, in order."
        steps:
          - {"kind": "http", "path": "/WANIP6FC.xml", "parse": "scpd", "expect": {"scpd.args.DeletePinhole": ["UniqueID"], "scpd.directions.DeletePinhole": ["in"]}}
      - name: 6fc1-2.6.6-must-getpinholepackets-unknown
        # spec gap: answers 501 Action Failed for an unknown UniqueID
        ref: "6FC1 §2.6.6"
        builds: [igd2]
        families: [ipv6]
        description: GetPinholePackets of an unknown UniqueID gets 704 NoSuchEntry.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: GetPinholePackets, args: {UniqueID: 65000},
             expect: {status: 500, fault: 704}}
      - name: 6fc1-2.6.6-must-scpd-getpinholepackets
        ref: "6FC1 §2.6.6"
        builds: ["igd2"]
        description: "The SCPD gives GetPinholePackets its arguments, in order."
        steps:
          - {"kind": "http", "path": "/WANIP6FC.xml", "parse": "scpd", "expect": {"scpd.args.GetPinholePackets": ["UniqueID", "PinholePackets"], "scpd.directions.GetPinholePackets": ["in", "out"]}}
      - name: 6fc1-2.6.7-may-checkpinholeworking
        ref: "6FC1 §2.6.7"
        builds: [igd2]
        families: [ipv6]
        description: CheckPinholeWorking of a new pinhole answers 1, or 709 NoTrafficReceived (or 602, optional).
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole, args: {<<: *pinhole_args, InternalPort: 44002},
             capture: {id: out.UniqueID}, expect: {status: 200}}
          - {kind: soap, service: WANIPv6FirewallControl, action: CheckPinholeWorking, args: {UniqueID: $id},
             expect: {fault: {one_of: [null, 709, 602]}}}
        cleanup:
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: $id}}
      - name: 6fc1-2.6.7-may-checkpinholeworking-unknown
        # spec gap: answers 501 Action Failed for an unknown UniqueID
        ref: "6FC1 §2.6.7"
        builds: [igd2]
        families: [ipv6]
        description: CheckPinholeWorking of an unknown UniqueID gets 704 NoSuchEntry.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: CheckPinholeWorking, args: {UniqueID: 65000},
             expect: {status: 500, fault: 704}}

  - name: GENA
    description: Eventing (UDA-1.1 §4.1, §4.3) of the services, SUBSCRIBE, renewal, UNSUBSCRIBE, the
      malformed requests and their status codes, and the events a mapping change sends.
    cases:
      - name: uda11-4.1.1-must-unique-sid
        ref: "UDA-1.1 §4.1.1"
        families: ["ipv4"]
        description: "Two subscriptions have different SIDs."
        steps:
          - {"kind": "subscribe", "capture": {"a": "sid"}, "expect": {"status": 200}}
          - {"kind": "subscribe", "capture": {"b": "sid"}, "expect": {"status": 200, "sid": {"not_equals": "$a"}}}
        cleanup:
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$a"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$b"}
      - name: uda11-4.1.1-must-infinite-ignored
        ref: "UDA-1.1 §4.1.1"
        families: ["ipv4"]
        description: "The keyword infinite is ignored and never returned."
        steps:
          - {"kind": "subscribe", "timeout": "infinite", "capture": {"a": "sid"}, "expect": {"status": 200, "timeout": {"matches": "^Second-[0-9]+$"}}}
        cleanup:
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$a"}
      - name: uda11-4.1.2-must-subscribe
        ref: "UDA-1.1 §4.1.2"
        description: SUBSCRIBE to WANIPConnection returns 200 with a SID uuid:... and TIMEOUT Second-N.
        steps:
          - {kind: subscribe, capture: {sid: sid}, expect: {status: 200, sid: {matches: "^uuid:"}, timeout: {matches: "^Second-[0-9]+$"}}}
        cleanup:
          - {kind: subscribe, mode: unsubscribe, sid: $sid}
      - name: uda11-4.1.2-must-missing-callback
        ref: "UDA-1.1 §4.1.2"
        description: A SUBSCRIBE with NT but no CALLBACK gets 412 Precondition Failed.
        steps:
          - {kind: subscribe, mode: raw, headers: [[NT, "upnp:event"], [TIMEOUT, Second-300]], expect: {status: 412}}
      - name: uda11-4.1.2-must-bad-nt
        requires: [strict]
        ref: "UDA-1.1 §4.1.2"
        description: A SUBSCRIBE whose NT is not upnp:event gets 412 Precondition Failed.
        steps:
          - {kind: subscribe, mode: raw, headers: [[CALLBACK, "<{callback}>"], [NT, "upnp:other"]], expect: {status: 412}}
      - name: uda11-4.1.2-must-bad-callback
        ref: "UDA-1.1 §4.1.2"
        description: A CALLBACK that is not an HTTP URL gets 412 Precondition Failed.
        steps:
          - {kind: subscribe, mode: raw, headers: [[CALLBACK, "<ftp://example.com/>"], [NT, "upnp:event"]], expect: {status: 412}}
      - name: uda11-4.1.2-impl-unknown-event-url
        # spec gap: answers 200 with a SID for an event path that is not a service's
        ref: "UDA-1.1 §4.1.2"
        description: A SUBSCRIBE to a URL that is not an event URL is refused (no SID).
        steps:
          - {kind: subscribe, path: /evt/NoSuchService, expect: {status: {not_equals: 200}, sid: {present: false}}}
      - name: uda11-4.1.2-should-granted-duration
        ref: "UDA-1.1 §4.1.2"
        description: The actual duration in TIMEOUT SHOULD be 1800 seconds or more, also when the request asks
          for 2 (so the expiry of a subscription cannot be checked in a short run).
        steps:
          - {kind: subscribe, timeout: Second-2, capture: {sid: sid},
             expect: {status: 200, timeout: {matches: "^Second-(1[89][0-9]{2}|[2-9][0-9]{3}|[0-9]{5,})$"}}}
        cleanup:
          - {kind: subscribe, mode: unsubscribe, sid: $sid}
      - name: uda11-4.1.2-must-missing-nt
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        requires: ["strict"]
        description: "A SUBSCRIBE without NT gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<{callback}>"]], "expect": {"status": 412}}
      - name: uda11-4.1.2-impl-timeout-value-second-0
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A TIMEOUT of 'Second-0' gets a valid duration, or a refusal."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<{callback}>"], ["NT", "upnp:event"], ["TIMEOUT", "Second-0"]], "expect": {"status": {"one_of": [200, 400, 412]}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-impl-timeout-value-second-1
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A TIMEOUT of 'Second--1' gets a valid duration, or a refusal."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<{callback}>"], ["NT", "upnp:event"], ["TIMEOUT", "Second--1"]], "expect": {"status": {"one_of": [200, 400, 412]}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-impl-timeout-value-second-abc
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A TIMEOUT of 'Second-abc' gets a valid duration, or a refusal."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<{callback}>"], ["NT", "upnp:event"], ["TIMEOUT", "Second-abc"]], "expect": {"status": {"one_of": [200, 400, 412]}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-impl-timeout-value-second-99999999999999999999
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A TIMEOUT of 'Second-99999999999999999999' gets a valid duration, or a refusal."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<{callback}>"], ["NT", "upnp:event"], ["TIMEOUT", "Second-99999999999999999999"]], "expect": {"status": {"one_of": [200, 400, 412]}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-impl-timeout-value-minute-5
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A TIMEOUT of 'Minute-5' gets a valid duration, or a refusal."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<{callback}>"], ["NT", "upnp:event"], ["TIMEOUT", "Minute-5"]], "expect": {"status": {"one_of": [200, 400, 412]}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-impl-timeout-value-empty
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A TIMEOUT of '' gets a valid duration, or a refusal."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<{callback}>"], ["NT", "upnp:event"], ["TIMEOUT", ""]], "expect": {"status": {"one_of": [200, 400, 412]}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-must-callback-no-brackets
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A CALLBACK of 'http://@LAN4@.2:1/' gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "http://@LAN4@.2:1/"], ["NT", "upnp:event"]], "expect": {"status": 412}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-must-callback-empty
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A CALLBACK of '' gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", ""], ["NT", "upnp:event"]], "expect": {"status": 412}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-must-callback-empty-brackets
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A CALLBACK of '<>' gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<>"], ["NT", "upnp:event"]], "expect": {"status": 412}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-must-callback-no-host
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A CALLBACK of '<http://>' gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<http://>"], ["NT", "upnp:event"]], "expect": {"status": 412}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-must-callback-no-scheme
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A CALLBACK of '<@LAN4@.2:1/>' gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<@LAN4@.2:1/>"], ["NT", "upnp:event"]], "expect": {"status": 412}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-must-callback-https
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A CALLBACK of '<https://@LAN4@.2/>' gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<https://@LAN4@.2/>"], ["NT", "upnp:event"]], "expect": {"status": 412}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-must-callback-open-bracket
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A CALLBACK of '<http://@LAN4@.2/' gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<http://@LAN4@.2/"], ["NT", "upnp:event"]], "expect": {"status": 412}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-must-callback-9000-bytes
        # spec gap: status was 200, expected one of [412, 500, 503]
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "A CALLBACK too long to keep whole is refused."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["CALLBACK", "<http://@LAN4@.>"], ["NT", "upnp:event"]], "expect": {"status": {"one_of": [412, 500, 503]}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.2-impl-subscribe-flood
        ref: "UDA-1.1 §4.1.2"
        families: ["ipv4"]
        description: "Thirty subscriptions at once do not stop the daemon."
        steps:
          - {"kind": "subscribe", "capture": {"s0": "sid"}}
          - {"kind": "subscribe", "capture": {"s1": "sid"}}
          - {"kind": "subscribe", "capture": {"s2": "sid"}}
          - {"kind": "subscribe", "capture": {"s3": "sid"}}
          - {"kind": "subscribe", "capture": {"s4": "sid"}}
          - {"kind": "subscribe", "capture": {"s5": "sid"}}
          - {"kind": "subscribe", "capture": {"s6": "sid"}}
          - {"kind": "subscribe", "capture": {"s7": "sid"}}
          - {"kind": "subscribe", "capture": {"s8": "sid"}}
          - {"kind": "subscribe", "capture": {"s9": "sid"}}
          - {"kind": "subscribe", "capture": {"s10": "sid"}}
          - {"kind": "subscribe", "capture": {"s11": "sid"}}
          - {"kind": "subscribe", "capture": {"s12": "sid"}}
          - {"kind": "subscribe", "capture": {"s13": "sid"}}
          - {"kind": "subscribe", "capture": {"s14": "sid"}}
          - {"kind": "subscribe", "capture": {"s15": "sid"}}
          - {"kind": "subscribe", "capture": {"s16": "sid"}}
          - {"kind": "subscribe", "capture": {"s17": "sid"}}
          - {"kind": "subscribe", "capture": {"s18": "sid"}}
          - {"kind": "subscribe", "capture": {"s19": "sid"}}
          - {"kind": "subscribe", "capture": {"s20": "sid"}}
          - {"kind": "subscribe", "capture": {"s21": "sid"}}
          - {"kind": "subscribe", "capture": {"s22": "sid"}}
          - {"kind": "subscribe", "capture": {"s23": "sid"}}
          - {"kind": "subscribe", "capture": {"s24": "sid"}}
          - {"kind": "subscribe", "capture": {"s25": "sid"}}
          - {"kind": "subscribe", "capture": {"s26": "sid"}}
          - {"kind": "subscribe", "capture": {"s27": "sid"}}
          - {"kind": "subscribe", "capture": {"s28": "sid"}}
          - {"kind": "subscribe", "capture": {"s29": "sid"}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
        cleanup:
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s0"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s1"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s2"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s3"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s4"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s5"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s6"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s7"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s8"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s9"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s10"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s11"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s12"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s13"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s14"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s15"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s16"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s17"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s18"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s19"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s20"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s21"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s22"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s23"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s24"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s25"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s26"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s27"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s28"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$s29"}
      - name: uda11-4.1.3-must-renew
        ref: "UDA-1.1 §4.1.3"
        description: SUBSCRIBE with the SID renews the subscription (200, the same SID).
        steps:
          - {kind: subscribe, capture: {sid: sid}, expect: {status: 200}}
          - {kind: subscribe, mode: renew, sid: $sid, expect: {status: 200, sid: $sid, timeout: {matches: "^Second-[0-9]+$"}}}
        cleanup:
          - {kind: subscribe, mode: unsubscribe, sid: $sid}
      - name: uda11-4.1.3-must-renew-unknown-sid
        ref: "UDA-1.1 §4.1.3"
        description: Renewing a SID that is not a known subscription gets 412 Precondition Failed.
        steps:
          - {kind: subscribe, mode: renew, sid: "uuid:00000000-0000-0000-0000-000000000000", expect: {status: 412}}
      - name: uda11-4.1.3-must-sid-and-nt
        requires: [strict]
        ref: "UDA-1.1 §4.1.3"
        description: A SUBSCRIBE with SID and NT gets 400 Incompatible header.
        steps:
          - {kind: subscribe, capture: {sid: sid}, expect: {status: 200}}
          - {kind: subscribe, mode: raw, headers: [[SID, $sid], [NT, "upnp:event"]], expect: {status: 400}}
        cleanup:
          - {kind: subscribe, mode: unsubscribe, sid: $sid}
      - name: uda11-4.1.3-must-sid-and-callback
        requires: [strict]
        ref: "UDA-1.1 §4.1.3"
        description: A SUBSCRIBE with SID and CALLBACK gets 400 Incompatible header.
        steps:
          - {kind: subscribe, capture: {sid: sid}, expect: {status: 200}}
          - {kind: subscribe, mode: raw, headers: [[SID, $sid], [CALLBACK, "<{callback}>"]], expect: {status: 400}}
        cleanup:
          - {kind: subscribe, mode: unsubscribe, sid: $sid}
      - name: uda11-4.1.3-must-renew-empty-sid
        ref: "UDA-1.1 §4.1.3"
        families: ["ipv4"]
        description: "A renewal with an empty SID gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["SID", ""]], "expect": {"status": 412}}
      - name: uda11-4.1.3-must-sid-no-prefix
        ref: "UDA-1.1 §4.1.3"
        families: ["ipv4"]
        description: "A malformed SID gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["SID", "abc"]], "expect": {"status": 412}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.3-must-sid-empty-uuid
        ref: "UDA-1.1 §4.1.3"
        families: ["ipv4"]
        description: "A malformed SID gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["SID", "uuid:"]], "expect": {"status": 412}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.3-must-sid-long
        ref: "UDA-1.1 §4.1.3"
        families: ["ipv4"]
        description: "A malformed SID gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "headers": [["SID", "uuid:"]], "expect": {"status": 412}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-4.1.4-must-unsubscribe
        ref: "UDA-1.1 §4.1.4"
        description: UNSUBSCRIBE ends the subscription; renewing it afterwards gets 412.
        steps:
          - {kind: subscribe, capture: {sid: sid}, expect: {status: 200}}
          - {kind: subscribe, mode: unsubscribe, sid: $sid, expect: {status: 200}}
          - {kind: subscribe, mode: renew, sid: $sid, expect: {status: 412}}
      - name: uda11-4.1.4-must-unsubscribe-unknown-sid
        ref: "UDA-1.1 §4.1.4"
        description: UNSUBSCRIBE of an unknown SID gets 412 Precondition Failed.
        steps:
          - {kind: subscribe, mode: unsubscribe, sid: "uuid:00000000-0000-0000-0000-000000000000", expect: {status: 412}}
      - name: uda11-4.1.4-must-unsubscribe-with-nt
        requires: [strict]
        ref: "UDA-1.1 §4.1.4"
        description: An UNSUBSCRIBE with SID and NT gets 400 Incompatible header.
        steps:
          - {kind: subscribe, capture: {sid: sid}, expect: {status: 200}}
          - {kind: subscribe, mode: raw, method: UNSUBSCRIBE, headers: [[SID, $sid], [NT, "upnp:event"]], expect: {status: 400}}
        cleanup:
          - {kind: subscribe, mode: unsubscribe, sid: $sid}
      - name: uda11-4.1.4-must-unsubscribe-with-callback
        ref: "UDA-1.1 §4.1.4"
        families: ["ipv4"]
        requires: ["strict"]
        description: "UNSUBSCRIBE with SID and CALLBACK gets 400."
        steps:
          - {"kind": "subscribe", "mode": "raw", "method": "UNSUBSCRIBE", "headers": [["SID", "uuid:00000000-0000-0000-0000-000000000000"], ["CALLBACK", "<{callback}>"]], "expect": {"status": 400}}
      - name: uda11-4.1.4-must-unsubscribe-missing-sid
        ref: "UDA-1.1 §4.1.4"
        families: ["ipv4"]
        description: "UNSUBSCRIBE without a SID gets 412."
        steps:
          - {"kind": "subscribe", "mode": "raw", "method": "UNSUBSCRIBE", "headers": [], "expect": {"status": 412}}
      - name: uda11-4.3-must-per-subscription-event-key
        ref: "UDA-1.1 §4.3"
        families: ["ipv4"]
        description: "A new subscription starts at SEQ 0 whatever another one has reached."
        steps:
          - {"kind": "subscribe", "capture": {"a": "sid"}, "expect": {"status": 200}}
          - {"kind": "notify-wait", "sid": "$a", "seq": 0}
          - {"kind": "soap", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "UDP", "NewInternalClient": "$client", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43600, "NewInternalPort": 43600}, "expect": {"status": 200}}
          - {"kind": "notify-wait", "sid": "$a", "seq": 1}
          - {"kind": "subscribe", "capture": {"b": "sid"}, "expect": {"status": 200}}
          - {"kind": "notify-wait", "sid": "$b", "seq": 0}
        cleanup:
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43600, "NewProtocol": "UDP"}}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$a"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$b"}
      - name: uda11-4.3-must-event-to-all-subscribers
        ref: "UDA-1.1 §4.3"
        families: ["ipv4"]
        description: "Every subscriber gets the event."
        steps:
          - {"kind": "subscribe", "capture": {"a": "sid"}, "expect": {"status": 200}}
          - {"kind": "subscribe", "capture": {"b": "sid"}, "expect": {"status": 200}}
          - {"kind": "notify-wait", "sid": "$a", "seq": 0}
          - {"kind": "notify-wait", "sid": "$b", "seq": 0}
          - {"kind": "soap", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "UDP", "NewInternalClient": "$client", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43600, "NewInternalPort": 43600}, "expect": {"status": 200}}
          - {"kind": "notify-wait", "sid": "$a", "seq": 1}
          - {"kind": "notify-wait", "sid": "$b", "seq": 1}
        cleanup:
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43600, "NewProtocol": "UDP"}}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$a"}
          - {"kind": "subscribe", "mode": "unsubscribe", "sid": "$b"}
      - name: uda11-4.3.2-must-initial-event-wanipconnection
        ref: "UDA-1.1 §4.3.2"
        description: The initial NOTIFY has SEQ 0, NT upnp:event, NTS upnp:propchange and every evented variable.
        steps:
          - {kind: subscribe, capture: {sid: sid}, expect: {status: 200}}
          - kind: notify-wait
            sid: $sid
            seq: 0
            expect:
              received: true
              nt: "upnp:event"
              nts: "upnp:propchange"
              properties:
                contains:
                  igd1: [ConnectionStatus, ExternalIPAddress, PortMappingNumberOfEntries, PossibleConnectionTypes]
                  igd2: [ConnectionStatus, ExternalIPAddress, PortMappingNumberOfEntries, PossibleConnectionTypes,
                         SystemUpdateID]
              prop.ExternalIPAddress: "198.51.100.1"
              prop.ConnectionStatus: Connected
        cleanup:
          - {kind: subscribe, mode: unsubscribe, sid: $sid}
      - name: uda11-4.3.2-must-initial-event-wancommoninterfaceconfig
        ref: "UDA-1.1 §4.3.2"
        description: The initial NOTIFY of WANCommonInterfaceConfig has PhysicalLinkStatus.
        steps:
          - {kind: subscribe, service: WANCommonInterfaceConfig, capture: {sid: sid}, expect: {status: 200}}
          - {kind: notify-wait, sid: $sid, seq: 0, expect: {received: true, properties: {contains: PhysicalLinkStatus}}}
        cleanup:
          - {kind: subscribe, service: WANCommonInterfaceConfig, mode: unsubscribe, sid: $sid}
      - name: uda11-4.3.2-must-initial-event-layer3forwarding
        ref: "UDA-1.1 §4.3.2"
        description: The initial NOTIFY of Layer3Forwarding has DefaultConnectionService.
        steps:
          - {kind: subscribe, service: Layer3Forwarding, capture: {sid: sid}, expect: {status: 200}}
          - {kind: notify-wait, sid: $sid, seq: 0, expect: {received: true, properties: {contains: DefaultConnectionService}}}
        cleanup:
          - {kind: subscribe, service: Layer3Forwarding, mode: unsubscribe, sid: $sid}
      - name: uda11-4.3.2-must-initial-event-wanipv6firewallcontrol
        ref: "UDA-1.1 §4.3.2"
        builds: [igd2]
        description: The initial NOTIFY of WANIPv6FirewallControl has FirewallEnabled and InboundPinholeAllowed.
        steps:
          - {kind: subscribe, service: WANIPv6FirewallControl, capture: {sid: sid}, expect: {status: 200}}
          - {kind: notify-wait, sid: $sid, seq: 0,
             expect: {received: true, properties: {contains: [FirewallEnabled, InboundPinholeAllowed]}}}
        cleanup:
          - {kind: subscribe, service: WANIPv6FirewallControl, mode: unsubscribe, sid: $sid}
      - name: wanipc1-2.3-must-event-on-mapping-change
        ref: {igd1: "WANIPC1 §2.3", igd2: "WANIPC2 §2.4.4"}
        families: [ipv4]
        description: Adding a port mapping sends a NOTIFY with SEQ 1 and the new PortMappingNumberOfEntries.
        steps:
          - {kind: subscribe, capture: {sid: sid}, expect: {status: 200}}
          - {kind: notify-wait, sid: $sid, seq: 0, expect: {received: true}}
          - {kind: soap, action: AddPortMapping, args: {<<: *add_args, NewExternalPort: 43080, NewInternalPort: 43080}, expect: {status: 200}}
          - {kind: notify-wait, sid: $sid, seq: 1, timeout: 10,
             expect: {received: true, prop.PortMappingNumberOfEntries: {matches: "^[1-9][0-9]*$"}}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43080, NewProtocol: UDP}}
          - {kind: subscribe, mode: unsubscribe, sid: $sid}

  - name: Lease file and restart
    description: The UPnP lease_file (PROTO:eport:remote host:iaddr:iport:expiry:description lines, the remote
      host field of a build with SUPPORT_REMOTEHOST) and the mappings
      the daemon restores from it after a restart.
    cases:
      - name: wanipc1-2.2.14-impl-lease-restored-after-restart
        ref: {igd1: "WANIPC1 §2.2.14", igd2: "WANIPC2 §2.5.15"}
        families: [ipv4]
        requires: [restart, lease-file]
        description: A mapping with a lease is restored from the lease_file after a daemon restart, with at
          most its remaining lease.
        steps:
          - {kind: soap, action: AddPortMapping, args: {<<: *add_args, NewExternalPort: 43102, NewInternalPort: 43102}, expect: {status: 200}}
          - {kind: restart}
          - kind: soap
            action: GetSpecificPortMappingEntry
            args: {NewRemoteHost: "", NewExternalPort: 43102, NewProtocol: UDP}
            expect: {status: 200, out.NewInternalClient: $client, out.NewPortMappingDescription: upnp-wire,
                     out.NewLeaseDuration: {matches: "^([1-9][0-9]{0,2}|[1-2][0-9]{3}|3[0-5][0-9]{2}|3600)$"}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43102, NewProtocol: UDP}}
      - name: wanipc1-2.2.14-impl-lease-permanent-restored-after-restart
        ref: "WANIPC1 §2.2.14"
        families: [ipv4]
        builds: [igd1]
        requires: [restart, lease-file]
        description: A permanent mapping (lease 0, IGDv1) is restored after a daemon restart.
        steps:
          - {kind: soap, action: AddPortMapping, args: {<<: *add_args, NewExternalPort: 43103, NewInternalPort: 43103, NewLeaseDuration: 0},
             expect: {status: 200}}
          - {kind: restart}
          - {kind: soap, action: GetSpecificPortMappingEntry, args: {NewRemoteHost: "", NewExternalPort: 43103, NewProtocol: UDP},
             expect: {status: 200, out.NewLeaseDuration: "0"}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43103, NewProtocol: UDP}}
      - name: wanipc1-2.4.16-impl-lease-line-written
        ref: {igd1: "WANIPC1 §2.4.16", igd2: "WANIPC2 §2.5.16"}
        families: [ipv4]
        requires: [lease-file]
        description: An AddPortMapping writes one lease_file line with its protocol, ports, client and description.
        steps:
          - {kind: soap, action: AddPortMapping, args: {<<: *add_args, NewExternalPort: 43100, NewInternalPort: 43100}, expect: {status: 200}}
          - {kind: upnp-lease, match: "^UDP:43100:", wait_seconds: 3,
             expect: {count: 1, line: {matches: "^UDP:43100::@LAN4_RE@\\.2:43100:[0-9]+:upnp-wire$"}}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43100, NewProtocol: UDP}}
      - name: wanipc1-2.4.17-impl-lease-line-removed
        ref: {igd1: "WANIPC1 §2.4.17", igd2: "WANIPC2 §2.5.18"}
        families: [ipv4]
        requires: [lease-file]
        description: DeletePortMapping removes the mapping's lease_file line.
        steps:
          - {kind: soap, action: AddPortMapping, args: {<<: *add_args, NewExternalPort: 43101, NewInternalPort: 43101}, expect: {status: 200}}
          - {kind: upnp-lease, match: "^UDP:43101:", wait_seconds: 3, expect: {count: 1}}
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43101, NewProtocol: UDP}, expect: {status: 200}}
          - {kind: upnp-lease, match: "^UDP:43101:", wait_seconds: 3, expect: {count: 0}}
