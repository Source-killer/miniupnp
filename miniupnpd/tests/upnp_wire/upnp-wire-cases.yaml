        steps:
          - kind: http
            method: POST
            path: /ctl/IPConn
            headers: {Content-Type: "text/xml; charset=\"utf-8\"", SOAPAction: "\"urn:schemas-upnp-org:service:WANIPConnection:1#NoSuchAction\""}
            body: "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:NoSuchAction xmlns:u=\"urn:schemas-upnp-org:service:WANIPConnection:1\"/></s:Body></s:Envelope>"
            expect: {status: 500, header.content-type: "text/xml; charset=\"utf-8\"",
                     body: {matches: "<faultcode>[A-Za-z0-9]+:Client</faultcode>", contains: ["<faultstring>UPnPError</faultstring>", "urn:schemas-upnp-org:control-1-0", "<errorCode>401</errorCode>"]}}
