        steps:
          - kind: http
            raw: "POST /ctl/IPConn HTTP/1.1\r\nHOST: {host}\r\nContent-Type: text/xml; charset=\"utf-8\"\r\nSOAPAction: \"urn:schemas-upnp-org:service:WANIPConnection:1#GetGenericPortMappingEntry\"\r\nTransfer-Encoding: chunked\r\n\r\n28\r\n<?xml version=\"1.0\"?><s:Envelope xmlns:s\r\n12c\r\n=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:GetGenericPortMappingEntry xmlns:u=\"urn:schemas-upnp-org:service:WANIPConnection:1\"><NewPortMappingIndex>9999</NewPortMappingIndex></u:GetGenericPortMappingEntry></s:Body></s:Envelope>\r\n0\r\n\r\n"
            expect: {status: 500, body: {contains: "<errorCode>713</errorCode>"}}
      - name: rfc9112-7.1-must-huge-chunk-size
        # spec gap: status unexpectedly equals 200
        ref: "RFC9112 §7.1"
        families: ["ipv4"]
        description: "A chunk size that overflows is refused."
        steps:
          - {"kind": "http", "raw": "POST /ctl/IPConn HTTP/1.1\r\nHost: {host}\r\nContent-Type: text/xml\r\nSOAPAction: \"urn:schemas-upnp-org:service:WANIPConnection:1#GetExternalIPAddress\"\r\nTransfer-Encoding: chunked\r\n\r\nFFFFFFFFFFFFFFFFF\r\nx\r\n", "timeout": 2, "expect": {"status": {"not_equals": 200}}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: rfc9112-7.1-must-bad-chunk-size
        # spec gap: status unexpectedly equals 200
        ref: "RFC9112 §7.1"
        families: ["ipv4"]
        description: "A chunk size that is not hex is refused."
        steps:
          - {"kind": "http", "raw": "POST /ctl/IPConn HTTP/1.1\r\nHost: {host}\r\nContent-Type: text/xml\r\nSOAPAction: \"urn:schemas-upnp-org:service:WANIPConnection:1#GetExternalIPAddress\"\r\nTransfer-Encoding: chunked\r\n\r\nzz\r\nx\r\n0\r\n\r\n", "timeout": 2, "expect": {"status": {"not_equals": 200}}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: rfc9112-9.3-must-two-requests-one-connection
        ref: "RFC9112 §9.3"
        description: A server that does not keep the connection sends Connection close, and closes it.
        steps:
          - kind: http
            raw: "GET /rootDesc.xml HTTP/1.1\r\nHOST: {host}\r\n\r\n"
            repeat: 2
            expect: {statuses: {contains: 200}, header.connection: {matches: "(?i)close"}, closed: true}
      - name: rfc9112-9.6-must-close-after-request-close
        ref: "RFC9112 §9.6"
        families: ["ipv4"]
        description: "After a request with Connection close the server closes."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/1.1\r\nHost: {host}\r\nConnection: close\r\n\r\n", "expect": {"responses": 1, "closed": true}, "count": 2}
      - name: rfc9112-9.6-must-no-request-after-received-close
        ref: "RFC9112 §9.6"
        families: ["ipv4"]
        description: "A request after one with Connection close is not processed."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/1.1\r\nHost: {host}\r\nConnection: close\r\n\r\nGET /rootDesc.xml HTTP/1.1\r\nHost: {host}\r\n\r\n", "expect": {"responses": 1}, "count": 2}

  - name: Description
    description: The device and service descriptions (UDA-1.1 §2.3, §2.5) against the IGD device
      specification of the build, and the SCPD action lists against the actions miniupnpd implements.
    cases:
      - name: uda11-2.3-must-spec-version
        ref: "UDA-1.1 §2.3"
        description: specVersion is 1.1, the UDA version of the build (--uda-version default).
        steps:
          - {kind: http, path: /rootDesc.xml, parse: description, expect: {desc.spec_version: "1.1"}}
      - name: uda11-2.3-must-udn
        ref: "UDA-1.1 §2.3"
        description: The UDN of the root device is uuid:<the configured uuid>.
        steps:
          - {kind: http, path: /rootDesc.xml, parse: description, expect: {desc.udn: $udn}}
      - name: uda11-2.3-must-urls-resolve
        ref: "UDA-1.1 §2.3"
        description: Every service has an SCPD, control and event URL, and every SCPD URL can be fetched.
        steps:
          - {kind: http, path: /rootDesc.xml, parse: description, check_urls: true,
             expect: {desc.broken_urls: []}}
      - name: uda11-2.3-must-friendly-name
        ref: "UDA-1.1 §2.3"
        description: The root device has a friendlyName (REQUIRED).
        steps:
          - {kind: http, path: /rootDesc.xml, parse: description, expect: {desc.friendly_name: {present: true}}}
      - name: uda11-2.3-must-config-id
        ref: "UDA-1.1 §2.3"
        description: "The root element has configId."
        steps:
          - {"kind": "http", "path": "/rootDesc.xml", "parse": "description", "expect": {"desc.config_id": {"matches": "^[0-9]+$"}}}
      - name: uda11-2.3-must-device-identity
        ref: "UDA-1.1 §2.3"
        description: "Every device has manufacturer, modelName and friendlyName."
        steps:
          - {"kind": "http", "path": "/rootDesc.xml", "parse": "description", "expect": {"desc.manufacturers": {"not_contains": null}, "desc.model_names": {"not_contains": null}, "desc.friendly_names": {"not_contains": null}}}
      - name: uda11-2.3-must-no-urlbase
        ref: "UDA-1.1 §2.3"
        description: "UDA 1.1 descriptions have no URLBase."
        steps:
          - {"kind": "http", "path": "/rootDesc.xml", "parse": "description", "expect": {"desc.url_base": null}}
      - name: uda11-2.5-must-scpd-config-id
        # spec gap: scpd.config_id None does not match '^[0-9]+$'
        ref: "UDA-1.1 §2.5"
        description: "The SCPD root element has configId."
        steps:
          - {"kind": "http", "path": "/WANIPCn.xml", "parse": "scpd", "expect": {"scpd.config_id": {"matches": "^[0-9]+$"}}}
      - name: igd1-2.2-must-device-tree
        ref: {igd1: "IGD1 §2.2", igd2: "IGD2 §2.2"}
        description: The root device is the InternetGatewayDevice of the build, with an embedded WANDevice and
          WANConnectionDevice.
        steps:
          - {kind: http, path: /rootDesc.xml, parse: description,
             expect: {desc.device_types: [$igd, $wandevice, $wancd]}}
      - name: igd1-2.2-must-service-types
        ref: {igd1: "IGD1 §2.2", igd2: "IGD2 §2.2"}
        description: The services are Layer3Forwarding, WANCommonInterfaceConfig and WANIPConnection of the
          build (and WANIPv6FirewallControl on IGDv2).
        steps:
          - kind: http
            path: /rootDesc.xml
            parse: description
            expect:
              desc.service_types: {igd1: [$l3f, $wancic, $wanipc], igd2: [$l3f, $wancic, $wanipc, $fc6]}
      - name: igd1-2.2-must-service-ids
        ref: "IGD1 §2.2"
        description: "The service ids are the ones of the device tables."
        steps:
          - {"kind": "http", "path": "/rootDesc.xml", "parse": "description", "expect": {"desc.service_ids": {"contains": ["urn:upnp-org:serviceId:WANIPConn1", "urn:upnp-org:serviceId:WANCommonIFC1", "urn:upnp-org:serviceId:L3Forwarding1"]}}}
      - name: igd2-2.2-may-no-deviceprotection
        ref: "IGD2 §2.2"
        builds: [igd2]
        description: DeviceProtection:1 is not offered (configure never defines ENABLE_DP_SERVICE), so its
          actions are not covered.
        steps:
          - kind: http
            path: /rootDesc.xml
            parse: description
            expect: {desc.service_types: {not_contains: "urn:schemas-upnp-org:service:DeviceProtection:1"}}
      - name: wandev1-2.2-must-device-placement
        ref: "WANDEV1 §2.2"
        description: "WANConnectionDevice sits in WANDevice."
        steps:
          - {"kind": "http", "path": "/rootDesc.xml", "parse": "description", "expect": {"desc.device_children": {"contains": [{"igd1": "urn:schemas-upnp-org:device:WANDevice:1 urn:schemas-upnp-org:device:WANConnectionDevice:1", "igd2": "urn:schemas-upnp-org:device:WANDevice:2 urn:schemas-upnp-org:device:WANConnectionDevice:2"}]}}}
      - name: wancd1-2.2-must-service-placement
        ref: "WANCD1 §2.2"
        description: "WANIPConnection sits in WANConnectionDevice."
        steps:
          - {"kind": "http", "path": "/rootDesc.xml", "parse": "description", "expect": {"desc.service_placement": {"contains": [{"igd1": "urn:schemas-upnp-org:device:WANConnectionDevice:1 urn:schemas-upnp-org:service:WANIPConnection:1", "igd2": "urn:schemas-upnp-org:device:WANConnectionDevice:2 urn:schemas-upnp-org:service:WANIPConnection:2"}]}}}
      - name: wanipc1-2.3-must-scpd-wanipconnection-evented
        ref: {igd1: "WANIPC1 §2.3", igd2: "WANIPC2 §2.4"}
        description: The evented state variables of WANIPConnection (and SystemUpdateID on v2).
        steps:
          - kind: http
            path: /WANIPCn.xml
            parse: scpd
            expect:
              scpd.evented:
                igd1: [ConnectionStatus, ExternalIPAddress, PortMappingNumberOfEntries, PossibleConnectionTypes]
                igd2: [ConnectionStatus, ExternalIPAddress, PortMappingNumberOfEntries, PossibleConnectionTypes,
                       SystemUpdateID]
      - name: wanipc1-2.4-must-scpd-wanipconnection-actions
        ref: {igd1: "WANIPC1 §2.4", igd2: "WANIPC2 §2.5"}
        description: The WANIPConnection SCPD lists the REQUIRED actions of the service version.
        steps:
          - kind: http
            path: /WANIPCn.xml
            parse: scpd
            expect:
              scpd.actions:
                contains:
                  igd1: [SetConnectionType, GetConnectionTypeInfo, RequestConnection, ForceTermination, GetStatusInfo, GetNATRSIPStatus,
                         GetGenericPortMappingEntry, GetSpecificPortMappingEntry, AddPortMapping, DeletePortMapping,
                         GetExternalIPAddress]
                  igd2: [SetConnectionType, GetConnectionTypeInfo, RequestConnection, ForceTermination, GetStatusInfo,
                         GetNATRSIPStatus, GetGenericPortMappingEntry, GetSpecificPortMappingEntry, AddPortMapping,
                         AddAnyPortMapping, DeletePortMapping, DeletePortMappingRange, GetExternalIPAddress,
                         GetListOfPortMappings]
      - name: wanipc1-2.4-must-scpd-wanipconnection-v1-has-no-v2-actions
        ref: "WANIPC1 §2.4"
        builds: [igd1]
        description: The WANIPConnection:1 SCPD does not list the actions WANIPConnection:2 added.
        steps:
          - kind: http
            path: /WANIPCn.xml
            parse: scpd
            expect: {scpd.actions: {not_contains: [AddAnyPortMapping, DeletePortMappingRange, GetListOfPortMappings]}}
      - name: wanipc1-2.4.14-must-scpd-getgenericportmappingentry-arguments
        ref: {igd1: "WANIPC1 §2.4.14", igd2: "WANIPC2 §2.5.14"}
        description: GetGenericPortMappingEntry has NewPortMappingIndex then the eight entry arguments.
        steps:
          - kind: http
            path: /WANIPCn.xml
            parse: scpd
            expect:
              scpd.args.GetGenericPortMappingEntry: [NewPortMappingIndex, NewRemoteHost, NewExternalPort, NewProtocol,
                                                     NewInternalPort, NewInternalClient, NewEnabled,
                                                     NewPortMappingDescription, NewLeaseDuration]
      - name: wanipc1-2.4.16-must-scpd-addportmapping-arguments
        ref: {igd1: "WANIPC1 §2.4.16", igd2: "WANIPC2 §2.5.16"}
        description: AddPortMapping has its eight IN arguments in the order of the spec.
        steps:
          - kind: http
            path: /WANIPCn.xml
            parse: scpd
            expect:
              scpd.args.AddPortMapping: [NewRemoteHost, NewExternalPort, NewProtocol, NewInternalPort,
                                         NewInternalClient, NewEnabled, NewPortMappingDescription, NewLeaseDuration]
      - name: wanipc2-2.5.17-must-scpd-addanyportmapping-arguments
        ref: "WANIPC2 §2.5.17"
        builds: [igd2]
        description: AddAnyPortMapping has the AddPortMapping arguments and the OUT argument NewReservedPort.
        steps:
          - kind: http
            path: /WANIPCn.xml
            parse: scpd
            expect:
              scpd.args.AddAnyPortMapping: [NewRemoteHost, NewExternalPort, NewProtocol, NewInternalPort,
                                            NewInternalClient, NewEnabled, NewPortMappingDescription,
                                            NewLeaseDuration, NewReservedPort]
      - name: wancic1-2.4-must-scpd-wancommoninterfaceconfig-actions
        ref: "WANCIC1 §2.4"
        description: The WANCommonInterfaceConfig SCPD lists GetCommonLinkProperties and the GetTotal* counters.
        steps:
          - kind: http
            path: /WANCfg.xml
            parse: scpd
            expect:
              scpd.actions: {contains: [GetCommonLinkProperties, GetTotalBytesSent, GetTotalBytesReceived,
                                        GetTotalPacketsSent, GetTotalPacketsReceived]}
              scpd.evented: {contains: PhysicalLinkStatus}
      - name: l3f1-2.2-must-scpd-state-variables
        ref: "L3F1 §2.2"
        description: "DefaultConnectionService is a string."
        steps:
          - {"kind": "http", "path": "/L3F.xml", "parse": "scpd", "expect": {"scpd.type.DefaultConnectionService": "string"}}
      - name: l3f1-2.4-must-scpd-layer3forwarding-actions
        ref: "L3F1 §2.4"
        description: The Layer3Forwarding SCPD lists Get/SetDefaultConnectionService; DefaultConnectionService is evented.
        steps:
          - kind: http
            path: /L3F.xml
            parse: scpd
            expect: {scpd.actions: [GetDefaultConnectionService, SetDefaultConnectionService],
                     scpd.evented: [DefaultConnectionService]}
      - name: 6fc1-2.4-must-scpd-state-variables
        ref: "6FC1 §2.4"
        builds: ["igd2"]
        description: "The SCPD has the required variables with their types."
        steps:
          - {"kind": "http", "path": "/WANIP6FC.xml", "parse": "scpd", "expect": {"scpd.type.FirewallEnabled": "boolean", "scpd.type.InboundPinholeAllowed": "boolean", "scpd.type.A_ARG_TYPE_IPv6Address": "string", "scpd.type.A_ARG_TYPE_Port": "ui2", "scpd.type.A_ARG_TYPE_Protocol": "ui2", "scpd.type.A_ARG_TYPE_LeaseTime": "ui4", "scpd.type.A_ARG_TYPE_UniqueID": "ui2"}}
      - name: 6fc1-2.6-must-scpd-wanipv6firewallcontrol-actions
        ref: "6FC1 §2.6"
        builds: [igd2]
        description: The WANIPv6FirewallControl SCPD lists its seven actions; FirewallEnabled and
          InboundPinholeAllowed are evented.
        steps:
          - kind: http
            path: /WANIP6FC.xml
            parse: scpd
            expect:
              scpd.actions: [AddPinhole, CheckPinholeWorking, DeletePinhole, GetFirewallStatus,
                             GetOutboundPinholeTimeout, GetPinholePackets, UpdatePinhole]
              scpd.evented: [FirewallEnabled, InboundPinholeAllowed]
              scpd.args.AddPinhole: [RemoteHost, RemotePort, InternalClient, InternalPort, Protocol, LeaseTime,
                                     UniqueID]

  - name: WANIPConnection
    description: SOAP control of WANIPConnection (WANIPC1 / WANIPC2, UDA-1.1 §3) from this client over IPv4,
      the port mapping actions and their faults, secure mode and the permission rules (allow 1024-65535),
      and malformed control requests.
    cases:
      - name: uda10-3.3-may-querystatevariable
        ref: "UDA-1.0 §3.3"
        families: [ipv4]
        description: QueryStateVariable (UDA 1.0, deprecated in 1.1) returns the value of ConnectionStatus.
        steps:
          - kind: soap
            action: QueryStateVariable
            soapaction: '"urn:schemas-upnp-org:control-1-0#QueryStateVariable"'
            raw_body: "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:QueryStateVariable xmlns:u=\"urn:schemas-upnp-org:control-1-0\"><u:varName>ConnectionStatus</u:varName></u:QueryStateVariable></s:Body></s:Envelope>"
            expect: {status: 200, out.return: Connected}
      - name: uda10-3.3-may-querystatevariable-unknown
        ref: "UDA-1.0 §3.3"
        families: [ipv4]
        description: QueryStateVariable of a variable the service does not have gets 404 Invalid Var.
        steps:
          - kind: soap
            action: QueryStateVariable
            soapaction: '"urn:schemas-upnp-org:control-1-0#QueryStateVariable"'
            raw_body: "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:QueryStateVariable xmlns:u=\"urn:schemas-upnp-org:control-1-0\"><u:varName>NoSuchVariable</u:varName></u:QueryStateVariable></s:Body></s:Envelope>"
            expect: {status: 500, fault: 404}
      - name: uda11-2.1-must-not-well-formed-xml
        # spec gap: answers 200: the action is taken from SOAPAction and the body is not checked to be well-formed
        ref: "UDA-1.1 §2.1"
        families: [ipv4]
        description: A body that is not well-formed XML gets a 4xx status.
        steps:
          - {kind: soap, action: GetExternalIPAddress, raw_body: "<?xml version=\"1.0\"?><s:Envelope><s:Body><u:GetExt",
             expect: {status: {min: 400, max: 499}}}
      - name: uda11-2.1-impl-oversized-body
        ref: "UDA-1.1 §2.1"
        families: [ipv4]
        description: A 200 kB control request is refused, and the daemon keeps serving.
        steps:
          - kind: soap
            action: AddPortMapping
            raw_body: "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\"><s:Body><u:{action} xmlns:u=\"{service_type}\"><NewPortMappingDescription>{pad}</NewPortMappingDescription></u:{action}></s:Body></s:Envelope>"
            pad: 200000
            expect: {status: {not_equals: 200}}
          - {kind: soap, action: GetExternalIPAddress, expect: {status: 200}}
      - name: uda11-2.1-must-get-on-control-url
        ref: "UDA-1.1 §2.1"
        description: GET of a control URL is not a control request and gets a 4xx status.
        steps:
          - {kind: http, path: /ctl/IPConn, expect: {status: {min: 400, max: 499}}}
      - name: uda11-2.1-impl-nesting-5000-deep
        # spec gap: status unexpectedly equals 200
        ref: "UDA-1.1 §2.1"
        families: ["ipv4"]
        description: "A body nested 5000 elements deep does not stop the daemon."
