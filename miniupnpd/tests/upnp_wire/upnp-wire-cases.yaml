# The UPnP IGD protocol cases of miniupnpd: SSDP, HTTP, the description, SOAP control and GENA eventing.
#
# A case is named <doc>-<section>-<level>-<what>, from its ref: doc is the spec id in lower case without
# punctuation, section its number, level the strength of the requirement on the device: must (MUST, SHALL,
# REQUIRED, a required action), should (SHOULD, RECOMMENDED), may (MAY, OPTIONAL, an optional action) or
# impl (no requirement of the spec: miniupnpd's own behaviour). Cases of a section are in spec order.
# A ref of several builds names the first version. Every case cites a section of a spec (ref: "<id> §<section>",
# the ids of `specs`, see specs/README.md), lists its builds (igd1: the default build, igd2: --igd2; default both) and address families (default
# both), and runs `steps` (then `cleanup`, also after a failure) with lib_test.run_upnp_step:
#
#   kind: ssdp         an M-SEARCH (st, mx, man, host; null leaves a header out; target: multicast | unicast)
#   kind: ssdp-listen  the NOTIFY messages on the group within `seconds` (restart: around a daemon restart)
#   kind: http         a request: raw bytes ({host} is the router's host:port) or method/path/headers/body;
#                      parse: description | scpd adds desc.* / scpd.* values
#   kind: soap         an action on a service of the build (args in order; soapaction / raw_body / path override)
#   kind: subscribe    GENA SUBSCRIBE (mode: subscribe | renew | unsubscribe | raw)
#   kind: notify-wait  the next NOTIFY of a SID (and SEQ) on the case's event listener
#   kind: restart      the driver restarts the daemon
#   kind: upnp-lease   the lines of the daemon's lease_file that match `match`
#
# `expect` checks the step's values ({field: rules}: a bare value is `equals`; rules: equals, not_equals,
# min, max, nonzero, present, matches, contains, not_contains, one_of, remember); `capture` keeps a value
# as a variable ("$name" in later steps). A value {igd1: .., igd2: ..} or {ipv4: .., ipv6: ..} is resolved
# for the build and family. A check the daemon only builds with UPNP_STRICT has `requires: [strict]`, a
# SKIP unless the daemon was built with --strict (the igd1-strict, igd2-strict runs). A feature the daemon does not implement has `known_failure:
# <note>` (an XFAIL). Any other result that differs from the spec is a spec gap: a FAIL, with a `# spec
# gap:` comment naming the cause, never a changed expectation. The variables of every case: router, client, family, build,
# uuid, udn, location, the device and service types of the build (igd, wandevice, wancd, wanipc, wancic,
# l3f, fc6) and services (their control, event and SCPD paths).

specs: [UDA-1.0, UDA-1.1, IGD1, IGD2, WANDEV1, WANDEV2, WANCD1, WANCD2, WANIPC1, WANIPC2, WANCIC1, L3F1, 6FC1,
        DP1, RFC9112, SOAP11]

uuid: 3d3cec3a-8cf0-11e0-98ee-001a6bd2d07b

builds:
  igd1:
    services:
      WANIPConnection: {type: "urn:schemas-upnp-org:service:WANIPConnection:1", control: /ctl/IPConn,
                        event: /evt/IPConn, scpd: /WANIPCn.xml}
      WANCommonInterfaceConfig: {type: "urn:schemas-upnp-org:service:WANCommonInterfaceConfig:1",
                                 control: /ctl/CmnIfCfg, event: /evt/CmnIfCfg, scpd: /WANCfg.xml}
      Layer3Forwarding: {type: "urn:schemas-upnp-org:service:Layer3Forwarding:1", control: /ctl/L3F,
                         event: /evt/L3F, scpd: /L3F.xml}
    variables:
      igd: "urn:schemas-upnp-org:device:InternetGatewayDevice:1"
      wandevice: "urn:schemas-upnp-org:device:WANDevice:1"
      wancd: "urn:schemas-upnp-org:device:WANConnectionDevice:1"
      wanipc: "urn:schemas-upnp-org:service:WANIPConnection:1"
      wancic: "urn:schemas-upnp-org:service:WANCommonInterfaceConfig:1"
      l3f: "urn:schemas-upnp-org:service:Layer3Forwarding:1"
  igd2:
    services:
      WANIPConnection: {type: "urn:schemas-upnp-org:service:WANIPConnection:2", control: /ctl/IPConn,
                        event: /evt/IPConn, scpd: /WANIPCn.xml}
      WANCommonInterfaceConfig: {type: "urn:schemas-upnp-org:service:WANCommonInterfaceConfig:1",
                                 control: /ctl/CmnIfCfg, event: /evt/CmnIfCfg, scpd: /WANCfg.xml}
      Layer3Forwarding: {type: "urn:schemas-upnp-org:service:Layer3Forwarding:1", control: /ctl/L3F,
                         event: /evt/L3F, scpd: /L3F.xml}
      WANIPv6FirewallControl: {type: "urn:schemas-upnp-org:service:WANIPv6FirewallControl:1",
                               control: /ctl/IP6FCtl, event: /evt/IP6FCtl, scpd: /WANIP6FC.xml}
    variables:
      igd: "urn:schemas-upnp-org:device:InternetGatewayDevice:2"
      wandevice: "urn:schemas-upnp-org:device:WANDevice:2"
      wancd: "urn:schemas-upnp-org:device:WANConnectionDevice:2"
      wanipc: "urn:schemas-upnp-org:service:WANIPConnection:2"
      wancic: "urn:schemas-upnp-org:service:WANCommonInterfaceConfig:1"
      l3f: "urn:schemas-upnp-org:service:Layer3Forwarding:1"
      fc6: "urn:schemas-upnp-org:service:WANIPv6FirewallControl:1"

defs:
  # AddPortMapping arguments of this client (internal port = external port); cases override what they test
  add_args: &add_args
    NewRemoteHost: ""
    NewProtocol: UDP
    NewInternalClient: $client
    NewEnabled: 1
    NewPortMappingDescription: upnp-wire
    NewLeaseDuration: 3600
  pinhole_args: &pinhole_args
    RemoteHost: ""
    RemotePort: 0
    InternalClient: $client
    Protocol: 17
    LeaseTime: 3600

sections:
  - name: SSDP
    description: Discovery (UDA-1.1 §1). M-SEARCH for each search target of the build, malformed searches
      (which a device discards silently), the response headers, and the NOTIFY messages around a restart.
    cases:
      - name: uda11-1.2.2-must-alive-headers
        ref: "UDA-1.1 §1.2.2"
        requires: [restart]
        description: The ssdp:alive messages after a start have HOST of the group, CACHE-CONTROL, LOCATION,
          NT, NTS, SERVER, USN and BOOTID.UPNP.ORG.
        steps:
          - kind: ssdp-listen
            restart: true
            seconds: 5
            nts: ["ssdp:alive"]
            each:
              start: "NOTIFY * HTTP/1.1"
              header.host: {matches: {ipv4: "^239\\.255\\.255\\.250:1900$", ipv6: "^\\[(?i:ff02::c)\\]:1900$"}}
              header.cache-control: {matches: "^max-age *= *[0-9]+$"}
              header.location: $location
              header.nt: {present: true}
              header.nts: "ssdp:alive"
              header.server: {matches: " UPnP/1\\.1 "}
              header.usn: {matches: "^uuid:"}
              header.bootid.upnp.org: {matches: "^[0-9]+$"}
            expect: {"count.ssdp:alive": {min: 10}}
      - name: uda11-1.2.2-must-bootid-increases-on-restart
        ref: "UDA-1.1 §1.2.2"
        requires: [restart]
        description: BOOTID.UPNP.ORG is increased each time the device rejoins the network.
        steps:
          - {kind: ssdp, st: "upnp:rootdevice", capture: {before: header.bootid.upnp.org}}
          - {kind: restart}
          - {kind: ssdp, st: "upnp:rootdevice", expect: {header.bootid.upnp.org: {not_equals: $before}}}
      - name: uda11-1.2.2-must-alive-repeats
        ref: "UDA-1.1 §1.2.2"
        families: [ipv4]
        description: The device repeats ssdp:alive within its advertisement interval (notify_interval=30).
        steps:
          - {kind: ssdp-listen, seconds: 32, nts: ["ssdp:alive"], expect: {"count.ssdp:alive": {min: 1}}}
      - name: uda11-1.2.3-should-notify-on-restart
        ref: "UDA-1.1 §1.2.3"
        requires: [restart]
        description: A daemon restart sends ssdp:byebye when it stops and ssdp:alive when it starts.
        steps:
          - {kind: ssdp-listen, restart: true, seconds: 5,
             expect: {"count.ssdp:byebye": {min: 1}, "count.ssdp:alive": {min: 1}}}
      - name: uda11-1.3.2-must-unicast-search
        # spec gap: count was 0, expected 1
        ref: "UDA-1.1 §1.3.2"
        description: A unicast M-SEARCH to the device's address and port 1900 is answered (within 1 second).
        steps:
          - {kind: ssdp, target: unicast, st: "upnp:rootdevice", mx: null, wait: 1.5, expect: {count: 1}}
      - name: uda11-1.3.2-must-igd-v1-to-igdv2
        ref: "UDA-1.1 §1.3.2"
        builds: [igd2]
        description: An IGDv2 answers a search for InternetGatewayDevice:1, with the version of the request in ST.
        steps:
          - kind: ssdp
            st: "urn:schemas-upnp-org:device:InternetGatewayDevice:1"
            expect: {count: 1, header.st: "urn:schemas-upnp-org:device:InternetGatewayDevice:1"}
      - name: uda11-1.3.2-must-wanipconnection-v1-to-igdv2
        ref: "UDA-1.1 §1.3.2"
        builds: [igd2]
        description: An IGDv2 answers a search for WANIPConnection:1, with the version of the request in ST.
        steps:
          - kind: ssdp
            st: "urn:schemas-upnp-org:service:WANIPConnection:1"
            expect: {count: 1, header.st: "urn:schemas-upnp-org:service:WANIPConnection:1"}
      - name: uda11-1.3.3-must-missing-man
        # spec gap: also with --strict: minissdp.c checks the MAN value only when the header is there
        requires: [strict]
        ref: "UDA-1.1 §1.3.3"
        description: An M-SEARCH without the REQUIRED MAN header is malformed and is discarded silently.
        steps:
          - {kind: ssdp, st: "upnp:rootdevice", man: null, expect: {count: 0}}
      - name: uda11-1.3.3-must-bad-man
        requires: [strict]
        ref: "UDA-1.1 §1.3.3"
        description: An M-SEARCH with a MAN other than "ssdp:discover" is discarded silently.
        steps:
          - {kind: ssdp, st: "upnp:rootdevice", man: '"ssdp:other"', expect: {count: 0}}
      - name: uda11-1.3.3-must-mx-zero
        requires: [strict]
        ref: "UDA-1.1 §1.3.3"
        description: MX MUST be at least 1; an M-SEARCH with MX 0 is malformed and is discarded.
        steps:
          - {kind: ssdp, st: "upnp:rootdevice", mx: 0, wait: 2, expect: {count: 0}}
      - name: uda11-1.3.3-must-mx-not-a-number
        requires: [strict]
        ref: "UDA-1.1 §1.3.3"
        description: An M-SEARCH whose MX is not an integer is malformed and is discarded silently.
        steps:
          - {kind: ssdp, st: "upnp:rootdevice", mx: abc, wait: 2, expect: {count: 0}}
      - name: uda11-1.3.3-must-missing-st
        ref: "UDA-1.1 §1.3.3"
        description: An M-SEARCH without the REQUIRED ST is discarded silently.
        steps:
          - {kind: ssdp, st: null, expect: {count: 0}}
      - name: uda11-1.3.3-must-igd-v2-to-igdv1
        requires: [strict]
        ref: "UDA-1.1 §1.3.3"
        builds: [igd1]
        description: An IGDv1 does not answer a search for InternetGatewayDevice:2, a version it does not have.
        steps:
          - {kind: ssdp, st: "urn:schemas-upnp-org:device:InternetGatewayDevice:2", expect: {count: 0}}
      - name: uda11-1.3.3-must-wanipconnection-v2-to-igdv1
        requires: [strict]
        ref: "UDA-1.1 §1.3.3"
        builds: [igd1]
        description: An IGDv1 does not answer a search for WANIPConnection:2.
        steps:
          - {kind: ssdp, st: "urn:schemas-upnp-org:service:WANIPConnection:2", expect: {count: 0}}
      - name: uda11-1.3.3-must-all-every-type
        ref: "UDA-1.1 §1.3.3"
        description: ssdp:all is answered for the root device, every device and service type and every UUID.
        steps:
          - kind: ssdp
            st: "ssdp:all"
            expect:
              sts: {contains: ["upnp:rootdevice", $udn, $igd, $wandevice, $wancd, $wanipc, $wancic, $l3f]}
      - name: uda11-1.3.3-must-all-fc6
        ref: "UDA-1.1 §1.3.3"
        builds: [igd2]
        description: ssdp:all includes WANIPv6FirewallControl:1 on an IGDv2.
        steps:
          - {kind: ssdp, st: "ssdp:all", expect: {sts: {contains: $fc6}}}
      - name: uda11-1.3.3-must-all-only-described-types
        # spec gap: sts ['upnp:rootdevice', 'urn:schemas-upnp-org:device:InternetGatewayDevice:1', 'urn:schemas-upnp-org:device:WA
        ref: "UDA-1.1 §1.3.3"
        description: ssdp:all is answered 3+2d+k times (d embedded devices, k service types), and only for
          types the description has.
        # spec gap: miniupnpd also answers for urn:schemas-upnp-org:service:WANPPPConnection:1, a service its description does not have
        steps:
          - kind: ssdp
            st: "ssdp:all"
            expect:
              sts: {not_contains: "urn:schemas-upnp-org:service:WANPPPConnection:1"}
              count: {igd1: 10, igd2: 11}
      - name: uda11-1.3.3-must-rootdevice
        ref: "UDA-1.1 §1.3.3"
        description: upnp:rootdevice is answered once, with ST upnp:rootdevice and USN uuid:<udn>::upnp:rootdevice.
        steps:
          - kind: ssdp
            st: "upnp:rootdevice"
            expect:
              count: 1
              header.st: "upnp:rootdevice"
              header.usn: "uuid:3d3cec3a-8cf0-11e0-98ee-001a6bd2d07b::upnp:rootdevice"
      - name: uda11-1.3.3-must-root-uuid
        ref: "UDA-1.1 §1.3.3"
        description: The root device's uuid is answered once, with ST and USN equal to it.
        steps:
          - {kind: ssdp, st: $udn, expect: {count: 1, header.st: $udn, header.usn: $udn}}
      - name: uda11-1.3.3-must-unknown-uuid
        ref: "UDA-1.1 §1.3.3"
        description: A uuid that is not the device's gets no answer.
        steps:
          - {kind: ssdp, st: "uuid:00000000-0000-0000-0000-000000000000", expect: {count: 0}}
      - name: uda11-1.3.3-must-igd-device-type
        ref: "UDA-1.1 §1.3.3"
        description: The InternetGatewayDevice type of the build is answered once.
        steps:
          - kind: ssdp
            st: $igd
            expect: {count: 1, header.st: $igd, header.usn: {matches: "^uuid:3d3cec3a-8cf0-11e0-98ee-001a6bd2d07b::urn:schemas-upnp-org:device:InternetGatewayDevice:[12]$"}}
      - name: uda11-1.3.3-must-wandevice-type
        ref: "UDA-1.1 §1.3.3"
        description: The embedded WANDevice type is answered once.
        steps:
          - {kind: ssdp, st: $wandevice, expect: {count: 1, header.st: $wandevice}}
      - name: uda11-1.3.3-must-wanconnectiondevice-type
        ref: "UDA-1.1 §1.3.3"
        description: The embedded WANConnectionDevice type is answered once.
        steps:
          - {kind: ssdp, st: $wancd, expect: {count: 1, header.st: $wancd}}
      - name: uda11-1.3.3-must-wanipconnection-type
        ref: "UDA-1.1 §1.3.3"
        description: The WANIPConnection service type of the build is answered once.
        steps:
          - {kind: ssdp, st: $wanipc, expect: {count: 1, header.st: $wanipc}}
      - name: uda11-1.3.3-must-wancommoninterfaceconfig-type
        ref: "UDA-1.1 §1.3.3"
        description: WANCommonInterfaceConfig:1 is answered once.
        steps:
          - {kind: ssdp, st: $wancic, expect: {count: 1, header.st: $wancic}}
      - name: uda11-1.3.3-must-layer3forwarding-type
        ref: "UDA-1.1 §1.3.3"
        description: Layer3Forwarding:1 is answered once.
        steps:
          - {kind: ssdp, st: $l3f, expect: {count: 1, header.st: $l3f}}
      - name: uda11-1.3.3-must-wanipv6firewallcontrol-type
        ref: "UDA-1.1 §1.3.3"
        builds: [igd2]
        description: WANIPv6FirewallControl:1 is answered once on an IGDv2.
        steps:
          - {kind: ssdp, st: $fc6, expect: {count: 1, header.st: $fc6}}
      - name: uda11-1.3.3-must-unknown-type
        ref: "UDA-1.1 §1.3.3"
        description: A service type the device does not have gets no answer.
        steps:
          - {kind: ssdp, st: "urn:schemas-upnp-org:service:NoSuchService:1", expect: {count: 0}}
      - name: uda11-1.3.3-must-missing-mx
        requires: [strict]
        ref: "UDA-1.1 §1.3.3"
        description: A multicast M-SEARCH without MX MUST be discarded silently.
        steps:
          - {kind: ssdp, st: "upnp:rootdevice", mx: null, wait: 2, expect: {count: 0}}
      - name: uda11-1.3.3-should-mx-over-five
        ref: "UDA-1.1 §1.3.3"
        description: An MX over 5 is taken as 5 or less, so the answer comes within 5 seconds.
        steps:
          - {kind: ssdp, st: "upnp:rootdevice", mx: 120, wait: 6, expect: {count: 1}}
      - name: uda11-1.3.3-must-response-headers
        ref: "UDA-1.1 §1.3.3"
        description: The response has CACHE-CONTROL max-age, EXT, LOCATION of the description, SERVER with
          UPnP/1.1, ST, USN and BOOTID.UPNP.ORG.
        steps:
          - kind: ssdp
            st: "upnp:rootdevice"
            expect:
              start: {matches: "^HTTP/1\\.1 200 OK$"}
              header.cache-control: {matches: "^max-age *= *[0-9]+$"}
              header.ext: {present: true}
              header.location: $location
              header.server: {matches: "^[^ /]+/[^ ]+ UPnP/1\\.1 [^ /]+/[^ ]+$"}
              header.st: "upnp:rootdevice"
              header.usn: {matches: "^uuid:[^:]+::upnp:rootdevice$"}
              header.bootid.upnp.org: {matches: "^[0-9]+$"}
      - name: uda11-1.3.3-must-every-response-well-formed
        ref: "UDA-1.1 §1.3.3"
        description: Every answer to ssdp:all has a USN starting with the device's UUID prefix and the LOCATION
          of the description.
        steps:
          - kind: ssdp
            st: "ssdp:all"
            each:
              header.usn: {matches: "^uuid:3d3cec3a-8cf0-11e0-98ee-001a6bd2d07[b-d](::.+)?$"}
              header.location: $location
              header.cache-control: {matches: "^max-age *= *[0-9]+$"}
            expect: {count: {min: 10}}
      - name: uda11-1.3.3-must-truncated-search-1
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An M-SEARCH cut after 1 bytes is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-truncated-search-4
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An M-SEARCH cut after 4 bytes is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SE", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-truncated-search-8
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An M-SEARCH cut after 8 bytes is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-truncated-search-16
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An M-SEARCH cut after 16 bytes is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-truncated-search-24
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An M-SEARCH cut after 24 bytes is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOS", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-truncated-search-32
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An M-SEARCH cut after 32 bytes is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.2", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-truncated-search-48
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An M-SEARCH cut after 48 bytes is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-truncated-search-64
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An M-SEARCH cut after 64 bytes is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:disc", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-truncated-search-76
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An M-SEARCH cut after 76 bytes is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-search-no-blank-line
        # spec gap: count was 1, expected 0
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An M-SEARCH without the blank line that ends it is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1\r\nST: upnp:rootdevice\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-garbage-datagram
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "A datagram of random text is discarded."
        steps:
          - {"kind": "ssdp", "raw": "\u0001\u0002\u0003 not ssdp at all \x7f", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-nul-in-st
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An ST with a NUL byte is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1\r\nST: upnp:root\u0000device\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-oversized-datagram
        # spec gap: count was 1, expected 0
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "A 60000-byte datagram is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1\r\nST: upnp:rootdevice\r\nX-Pad: \r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-response-as-request
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "A search response sent to the device gets no answer."
        steps:
          - {"kind": "ssdp", "raw": "HTTP/1.1 200 OK\r\nST: upnp:rootdevice\r\nUSN: uuid:x\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-notify-as-request
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "A NOTIFY sent to the device gets no answer."
        steps:
          - {"kind": "ssdp", "raw": "NOTIFY * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nNT: upnp:rootdevice\r\nNTS: ssdp:alive\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-wrong-request-uri
        # spec gap: count was 1, expected 0
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        requires: ["strict"]
        description: "An M-SEARCH with a target other than * is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH /x HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1\r\nST: upnp:rootdevice\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-method-lower-case
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "m-search in lower case is not M-SEARCH."
        steps:
          - {"kind": "ssdp", "raw": "m-search * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1\r\nST: upnp:rootdevice\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-st-empty
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An empty ST gets no answer."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1\r\nST:\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-st-4096-bytes
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "A 4096-byte ST gets no answer."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1\r\nST: \r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-st-uuid-prefix-only
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "An ST of uuid: with no value gets no answer."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1\r\nST: uuid:\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-st-urn-no-version
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "A device URN without a version gets no answer."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1\r\nST: urn:schemas-upnp-org:device:InternetGatewayDevice\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-mx-value-1
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        requires: ["strict"]
        description: "An MX of -1 is malformed and discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: -1\r\nST: upnp:rootdevice\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-mx-value-1-5
        # spec gap: count was 1, expected 0
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        requires: ["strict"]
        description: "An MX of 1.5 is malformed and discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 1.5\r\nST: upnp:rootdevice\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-mx-value-0x1
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        requires: ["strict"]
        description: "An MX of 0x1 is malformed and discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 0x1\r\nST: upnp:rootdevice\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-mx-value-99999999999999999999
        # spec gap: count was 1, expected 0
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        requires: ["strict"]
        description: "An MX of 99999999999999999999 is malformed and discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 99999999999999999999\r\nST: upnp:rootdevice\r\n\r\n", "wait": 6, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-man-value-ssdp-discover
        # spec gap: count was 1, expected 0
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "A MAN of 'ssdp:discover' is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: ssdp:discover\r\nMX: 1\r\nST: upnp:rootdevice\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-man-value-ssdp-other
        # spec gap: count was 1, expected 0
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "A MAN of '\"ssdp:other\"' is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:other\"\r\nMX: 1\r\nST: upnp:rootdevice\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}
      - name: uda11-1.3.3-must-man-value-empty
        # spec gap: count was 1, expected 0
        ref: "UDA-1.1 §1.3.3"
        families: ["ipv4"]
        description: "A MAN of '' is discarded."
        steps:
          - {"kind": "ssdp", "raw": "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \r\nMX: 1\r\nST: upnp:rootdevice\r\n\r\n", "wait": 1.5, "expect": {"count": 0}}
          - {"kind": "ssdp", "st": "upnp:rootdevice", "expect": {"count": 1}}

  - name: HTTP
    description: The HTTP server that serves the description and the control and event URLs (UDA-1.1 §2.1,
      RFC 9112), with well-formed and malformed requests.
    cases:
      - name: uda11-2.1-must-unknown-path
        ref: "UDA-1.1 §2.1"
        description: GET of a path the device does not serve returns 404.
        steps:
          - {kind: http, path: /no-such-document.xml, expect: {status: 404}}
      - name: uda11-2.1-must-unsupported-method-4xx
        # spec gap: answers 501 Not Implemented, a 5xx
        ref: "UDA-1.1 §2.1"
        description: A method the server does not implement gets a 4xx status.
        steps:
          - kind: http
            raw: "PUT /rootDesc.xml HTTP/1.1\r\nHOST: {host}\r\nContent-Length: 0\r\n\r\n"
            expect: {status: {min: 400, max: 499}}
      - name: uda11-2.1-should-unsupported-method-405
        # spec gap: answers 501 Not Implemented, a 5xx
        ref: "UDA-1.1 §2.1"
        description: A method the server does not implement gets 405 Method Not Allowed.
        steps:
          - kind: http
            raw: "PUT /rootDesc.xml HTTP/1.1\r\nHOST: {host}\r\nContent-Length: 0\r\n\r\n"
            expect: {status: 405}
      - name: uda11-2.1-impl-oversized-header
        ref: "UDA-1.1 §2.1"
        description: A request with a 20000-byte header line is answered (200), or refused with a 4xx when it is
          larger than the server wishes to process, and the server keeps serving.
        steps:
          - kind: http
            raw: "GET /rootDesc.xml HTTP/1.1\r\nHOST: {host}\r\n{pad}\r\n\r\n"
            pad_header: 20000
            expect: {status: {one_of: [200, 400, 413, 431]}}
          - {kind: http, path: /rootDesc.xml, expect: {status: 200}}
      - name: uda11-2.1-impl-path-traversal-dotdot
        ref: "UDA-1.1 §2.1"
        families: ["ipv4"]
        description: "The target /../../../etc/passwd serves no file."
        steps:
          - {"kind": "http", "raw": "GET /../../../etc/passwd HTTP/1.1\r\nHost: {host}\r\n\r\n", "timeout": 2, "expect": {"status": {"not_equals": 200}, "body": {"not_contains": "root:"}}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: uda11-2.1-impl-path-traversal-encoded
        ref: "UDA-1.1 §2.1"
        families: ["ipv4"]
        description: "The target /%2e%2e/%2e%2e/etc/passwd serves no file."
        steps:
          - {"kind": "http", "raw": "GET /%2e%2e/%2e%2e/etc/passwd HTTP/1.1\r\nHost: {host}\r\n\r\n", "timeout": 2, "expect": {"status": {"not_equals": 200}, "body": {"not_contains": "root:"}}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: uda11-2.1-impl-path-traversal-double-slash
        ref: "UDA-1.1 §2.1"
        families: ["ipv4"]
        description: "The target //etc/passwd serves no file."
        steps:
          - {"kind": "http", "raw": "GET //etc/passwd HTTP/1.1\r\nHost: {host}\r\n\r\n", "timeout": 2, "expect": {"status": {"not_equals": 200}, "body": {"not_contains": "root:"}}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: uda11-2.1-impl-path-traversal-backslash
        ref: "UDA-1.1 §2.1"
        families: ["ipv4"]
        description: "The target /..\\..\\etc\\passwd serves no file."
        steps:
          - {"kind": "http", "raw": "GET /..\\..\\etc\\passwd HTTP/1.1\r\nHost: {host}\r\n\r\n", "timeout": 2, "expect": {"status": {"not_equals": 200}, "body": {"not_contains": "root:"}}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: uda11-2.1-must-http10-closes
        ref: "UDA-1.1 §2.1"
        families: ["ipv4"]
        description: "An HTTP/1.0 request without KeepAlive gets its answer and a close."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/1.0\r\n\r\n", "count": 2, "timeout": 2, "expect": {"responses": 1, "closed": true}}
      - name: uda11-2.1-must-http10-status-line
        ref: "UDA-1.1 §2.1"
        families: ["ipv4"]
        description: "A response to HTTP/1.0 is compatible with it."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/1.0\r\n\r\n", "timeout": 2, "expect": {"version": {"matches": "^HTTP/1\\.[01]$"}, "status": 200}}
      - name: uda11-2.11-must-get-description
        ref: "UDA-1.1 §2.11"
        description: GET of the description returns 200 with a text/xml body.
        steps:
          - kind: http
            path: /rootDesc.xml
            expect: {status: 200, header.content-type: {matches: "^text/xml"}, body: {contains: "<root"}}
      - name: uda11-2.11-may-description-headers
        ref: "UDA-1.1 §2.11"
        description: The description response has CONTENT-LENGTH and a SERVER with UPnP/1.1.
        steps:
          - kind: http
            path: /rootDesc.xml
            expect: {status: 200, header.content-length: {matches: "^[0-9]+$"},
                     header.server: {matches: " UPnP/1\\.1 "}}
      - name: uda11-2.11-must-get-scpd-wanipconnection
        ref: "UDA-1.1 §2.11"
        description: GET of the WANIPConnection SCPD returns 200 with a text/xml body.
        steps:
          - {kind: http, path: /WANIPCn.xml, expect: {status: 200, header.content-type: {matches: "^text/xml"},
                                                     body: {contains: "<scpd"}}}
      - name: uda11-2.11-must-get-scpd-wancommoninterfaceconfig
        ref: "UDA-1.1 §2.11"
        description: GET of the WANCommonInterfaceConfig SCPD returns 200.
        steps:
          - {kind: http, path: /WANCfg.xml, expect: {status: 200, body: {contains: "<scpd"}}}
      - name: uda11-2.11-must-get-scpd-layer3forwarding
        ref: "UDA-1.1 §2.11"
        description: GET of the Layer3Forwarding SCPD returns 200.
        steps:
          - {kind: http, path: /L3F.xml, expect: {status: 200, body: {contains: "<scpd"}}}
      - name: uda11-2.11-must-get-scpd-wanipv6firewallcontrol
        ref: "UDA-1.1 §2.11"
        builds: [igd2]
        description: GET of the WANIPv6FirewallControl SCPD returns 200.
        steps:
          - {kind: http, path: /WANIP6FC.xml, expect: {status: 200, body: {contains: "<scpd"}}}
      - name: rfc9112-2.2-impl-lf-only-line-ends
        # spec gap: status was None, expected one of [200, 400]
        ref: "RFC9112 §2.2"
        families: ["ipv4"]
        description: "Bare LF line ends are read as line ends, or refused."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/1.1\nHost: {host}\n\n", "timeout": 2, "expect": {"status": {"one_of": [200, 400]}}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: rfc9112-2.2-must-bare-cr-in-field
        ref: "RFC9112 §2.2"
        families: ["ipv4"]
        description: "A bare CR in a field is refused or replaced."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/1.1\r\nHost: {host}\r\nX-A: a\rb\r\n\r\n", "timeout": 2, "expect": {"status": {"one_of": [200, 400]}}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: rfc9112-2.2-must-whitespace-after-request-line
        # spec gap: status was 200, expected 400
        ref: "RFC9112 §2.2"
        families: ["ipv4"]
        description: "Whitespace before the first field is refused."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/1.1\r\n Host: {host}\r\n\r\n", "timeout": 2, "expect": {"status": 400}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: rfc9112-2.2-impl-nul-in-target
        ref: "RFC9112 §2.2"
        families: ["ipv4"]
        description: "A NUL in the target gets no document."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc\u0000.xml HTTP/1.1\r\nHost: {host}\r\n\r\n", "timeout": 2, "expect": {"status": {"not_equals": 200}}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: rfc9112-2.3-must-unknown-major-version
        # spec gap: status was 200, expected 505
        ref: "RFC9112 §2.3"
        families: ["ipv4"]
        description: "HTTP/9.9 gets 505."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/9.9\r\nHost: {host}\r\n\r\n", "timeout": 2, "expect": {"status": 505}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: rfc9112-3-must-long-target-414
        # spec gap: malformed HTTP status line b'aaaaaaaaaaaaaaa 404 Not Foundrn'
        ref: "RFC9112 §3"
        families: ["ipv4"]
        description: "A very long target gets 414."
        steps:
          - {"kind": "http", "raw": "GET  HTTP/1.1\r\nHost: {host}\r\n\r\n", "timeout": 2, "expect": {"status": 414}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: rfc9112-3-impl-long-method
        # spec gap: malformed HTTP status line b'AAAAAAAAAAAAAAA 501 Not Implementedrn'
        ref: "RFC9112 §3"
        families: ["ipv4"]
        description: "A 4096-byte method is refused."
        steps:
          - {"kind": "http", "raw": " / HTTP/1.1\r\nHost: {host}\r\n\r\n", "timeout": 2, "expect": {"status": {"not_equals": 200}}}
          - {"kind": "http", "path": "/rootDesc.xml", "expect": {"status": 200}}
      - name: rfc9112-3.1-must-method-case-sensitive
        ref: "RFC9112 §3.1"
        families: ["ipv4"]
        description: "The method is case sensitive: get is not GET."
        steps:
          - {"kind": "http", "raw": "get /rootDesc.xml HTTP/1.1\r\nHost: {host}\r\n\r\n", "expect": {"status": {"not_equals": 200}}}
      - name: rfc9112-3.2-should-malformed-request-line
        # spec gap: answers ' 501 Not Implemented': the status line repeats the request's (here empty) HTTP version
        ref: "RFC9112 §3.2"
        description: A request line that is not method SP target SP version gets 400.
        steps:
          - {kind: http, raw: "GARBAGE\r\n\r\n", expect: {status: 400}}
      - name: rfc9112-3.2-must-missing-host
        # spec gap: answers 200; upnphttp.c does not require Host
        ref: "RFC9112 §3.2"
        description: An HTTP/1.1 request without a Host header MUST get 400.
        steps:
          - {kind: http, raw: "GET /rootDesc.xml HTTP/1.1\r\n\r\n", expect: {status: 400}}
      - name: rfc9112-3.2-must-two-host-lines
        # spec gap: status was 404, expected 400
        ref: "RFC9112 §3.2"
        families: ["ipv4"]
        description: "A request with two Host field lines gets 400."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/1.1\r\nHost: {host}\r\nHost: other.example\r\n\r\n", "expect": {"status": 400}}
      - name: rfc9112-3.2-must-invalid-host-value
        # spec gap: status was 404, expected 400
        ref: "RFC9112 §3.2"
        families: ["ipv4"]
        description: "A request whose Host value is invalid gets 400."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/1.1\r\nHost: a b\r\n\r\n", "expect": {"status": 400}}
      - name: rfc9112-3.2.2-must-absolute-form
        # spec gap: status was 404, expected 200
        ref: "RFC9112 §3.2.2"
        families: ["ipv4"]
        description: "A server accepts an absolute-form request target."
        steps:
          - {"kind": "http", "raw": "GET http://{host}/rootDesc.xml HTTP/1.1\r\nHost: {host}\r\n\r\n", "expect": {"status": 200}}
      - name: rfc9112-5-must-field-name-case
        ref: "RFC9112 §5"
        families: ["ipv4"]
        description: "Field names are matched without regard to case."
        steps:
          - {"kind": "http", "raw": "GET /rootDesc.xml HTTP/1.1\r\nhOsT: {host}\r\n\r\n", "expect": {"status": 200}}
      - name: rfc9112-5-impl-thousand-headers
        ref: "RFC9112 §5"
        families: ["ipv4"]
