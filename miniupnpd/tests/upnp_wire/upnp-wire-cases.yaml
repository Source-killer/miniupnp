      - name: wanipc1-2.4.15-must-getspecificportmappingentry-unknown
        ref: {igd1: "WANIPC1 §2.4.15", igd2: "WANIPC2 §2.5.15"}
        families: [ipv4]
        description: A mapping that does not exist gets 714 NoSuchEntryInArray.
        steps:
          - {kind: soap, action: GetSpecificPortMappingEntry, args: {NewRemoteHost: "", NewExternalPort: 43003, NewProtocol: UDP},
             expect: {status: 500, fault: 714}}
      - name: wanipc1-2.4.15-must-scpd-getspecificportmappingentry
        ref: "WANIPC1 §2.4.15"
        description: "The SCPD gives GetSpecificPortMappingEntry its arguments, in order."
        steps:
          - {"kind": "http", "path": "/WANIPCn.xml", "parse": "scpd", "expect": {"scpd.args.GetSpecificPortMappingEntry": ["NewRemoteHost", "NewExternalPort", "NewProtocol", "NewInternalPort", "NewInternalClient", "NewEnabled", "NewPortMappingDescription", "NewLeaseDuration"], "scpd.directions.GetSpecificPortMappingEntry": ["in", "in", "in", "out", "out", "out", "out", "out"]}}
      - name: wanipc1-2.4.16-must-portmapping-lifecycle
        ref: {igd1: "WANIPC1 §2.4.16", igd2: "WANIPC2 §2.5.16"}
        families: [ipv4]
        description: AddPortMapping succeeds, GetSpecificPortMappingEntry returns the entry, DeletePortMapping
          removes it and a second GetSpecificPortMappingEntry gets 714.
        steps:
          - {kind: soap, action: AddPortMapping, args: {<<: *add_args, NewExternalPort: 43001, NewInternalPort: 43001},
             expect: {status: 200, element: AddPortMappingResponse}}
          - kind: soap
            action: GetSpecificPortMappingEntry
            args: {NewRemoteHost: "", NewExternalPort: 43001, NewProtocol: UDP}
            expect: {status: 200, out.NewInternalPort: "43001", out.NewInternalClient: $client, out.NewEnabled: "1",
                     out.NewPortMappingDescription: upnp-wire, out.NewLeaseDuration: {matches: "^[0-9]+$"}}
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43001, NewProtocol: UDP},
             expect: {status: 200}}
          - {kind: soap, action: GetSpecificPortMappingEntry, args: {NewRemoteHost: "", NewExternalPort: 43001, NewProtocol: UDP},
             expect: {status: 500, fault: 714}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43001, NewProtocol: UDP}}
      - name: wanipc1-2.4.16-impl-addportmapping-other-client
        ref: {igd1: "WANIPC1 §2.4.16", igd2: "WANIPC2 §2.5.16"}
        families: [ipv4]
        description: In secure mode a mapping for another InternalClient than the sender is refused (606 Action
          not authorized on WANIPConnection:2; WANIPConnection:1 has no 606, miniupnpd answers 718).
        steps:
          - {kind: soap, action: AddPortMapping,
             args: {<<: *add_args, NewExternalPort: 43006, NewInternalPort: 43006, NewInternalClient: "@LAN4@.99"},
             expect: {status: 500, fault: {igd1: 718, igd2: 606}}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43006, NewProtocol: UDP}}
      - name: wanipc1-2.4.16-impl-addportmapping-denied-port
        ref: {igd1: "WANIPC1 §2.4.16", igd2: "WANIPC2 §2.5.16"}
        families: [ipv4]
        description: A mapping the permission rules deny (internal port 80; allow covers 1024-65535) is refused
          (606 on v2, 718 on v1).
        steps:
          - {kind: soap, action: AddPortMapping, args: {<<: *add_args, NewExternalPort: 43007, NewInternalPort: 80},
             expect: {status: 500, fault: {igd1: 718, igd2: 606}}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43007, NewProtocol: UDP}}
      - name: wanipc1-2.4.16-may-addportmapping-wildcard-external-port
        ref: {igd1: "WANIPC1 §2.4.16", igd2: "WANIPC2 §2.5.16"}
        families: [ipv4]
        description: NewExternalPort 0 (a wildcard) gets 716 WildCardNotPermittedInExtPort.
        steps:
          - {kind: soap, action: AddPortMapping, args: {<<: *add_args, NewExternalPort: 0, NewInternalPort: 43008},
             expect: {status: 500, fault: 716}}
      - name: wanipc1-2.4.16-may-addportmapping-remote-host
        ref: {igd1: "WANIPC1 §2.4.16", igd2: "WANIPC2 §2.5.16"}
        families: [ipv4]
        description: A specific NewRemoteHost is accepted (a must on v2), or on v1 refused with 726 RemoteHostOnlySupportsWildcard.
        steps:
          - {kind: soap, action: AddPortMapping, args: {<<: *add_args, NewRemoteHost: 198.51.100.2, NewExternalPort: 43013, NewInternalPort: 43013},
             expect: {status: {igd1: {one_of: [200, 500]}, igd2: 200}, fault: {one_of: [null, 726]}}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: 198.51.100.2, NewExternalPort: 43013, NewProtocol: UDP}}
      - name: wanipc1-2.4.16-impl-addportmapping-from-ipv6-client
        ref: {igd1: "WANIPC1 §2.4.16", igd2: "WANIPC2 §2.5.16"}
        families: [ipv6]
        description: A client on IPv6 cannot map an IPv4 port for an IPv4 InternalClient in secure mode
          (606 on v2, 718 on v1), since the daemon cannot check the sender.
        steps:
          - {kind: soap, action: AddPortMapping,
             args: {<<: *add_args, NewExternalPort: 43070, NewInternalPort: 43070, NewInternalClient: "@LAN4@.2"},
             expect: {status: 500, fault: {igd1: 718, igd2: 606}}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43070, NewProtocol: UDP}}
      - name: wanipc1-2.4.16-must-conflict-other-client
        ref: "WANIPC1 §2.4.16"
        families: ["ipv4"]
        requires: ["second-client"]
        description: "A port another client holds gets 718."
        steps:
          - {"kind": "soap", "client": "second", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "UDP", "NewInternalClient": "$client2", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43105, "NewInternalPort": 43105}, "expect": {"status": 200}}
          - {"kind": "soap", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "UDP", "NewInternalClient": "$client", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43105, "NewInternalPort": 43105}, "expect": {"status": 500, "fault": 718}}
        cleanup:
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43105, "NewProtocol": "UDP"}, "client": "second"}
      - name: wanipc1-2.4.16-must-same-port-other-protocol
        ref: "WANIPC1 §2.4.16"
        families: ["ipv4"]
        description: "The other protocol on a port in use succeeds."
        steps:
          - {"kind": "soap", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "UDP", "NewInternalClient": "$client", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43106, "NewInternalPort": 43106}, "expect": {"status": 200}}
          - {"kind": "soap", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "TCP", "NewInternalClient": "$client", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43106, "NewInternalPort": 43106}, "expect": {"status": 200}}
        cleanup:
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43106, "NewProtocol": "UDP"}}
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43106, "NewProtocol": "TCP"}}
