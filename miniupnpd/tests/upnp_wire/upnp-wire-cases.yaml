          - {"kind": "soap", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "UDP", "NewInternalClient": "$client", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43101, "NewInternalPort": 43101}, "expect": {"status": 200}}
          - {"kind": "soap", "action": "DeletePortMappingRange", "args": {"NewStartPort": 43100, "NewEndPort": 43101, "NewProtocol": "UDP", "NewManage": 0}, "expect": {"status": 200}}
          - {"kind": "soap", "client": "second", "action": "GetSpecificPortMappingEntry", "args": {"NewRemoteHost": "", "NewExternalPort": 43100, "NewProtocol": "UDP"}, "expect": {"status": 200}}
        cleanup:
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43100, "NewProtocol": "UDP"}, "client": "second"}
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43101, "NewProtocol": "UDP"}}
      - name: wanipc2-2.5.19-must-bad-protocol
        # spec gap: fault was 730, expected 601
        ref: "WANIPC2 §2.5.19"
        families: ["ipv4"]
        builds: ["igd2"]
        description: "A bad NewProtocol gets 601."
        steps:
          - {"kind": "soap", "action": "DeletePortMappingRange", "args": {"NewStartPort": 43115, "NewEndPort": 43116, "NewProtocol": "ICMP", "NewManage": 0}, "expect": {"status": 500, "fault": 601}}
      - name: wanipc2-2.5.19-must-other-protocol-kept
        ref: "WANIPC2 §2.5.19"
        families: ["ipv4"]
        builds: ["igd2"]
        description: "Only mappings of NewProtocol are removed."
        steps:
          - {"kind": "soap", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "UDP", "NewInternalClient": "$client", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43120, "NewInternalPort": 43120}, "expect": {"status": 200}}
          - {"kind": "soap", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "TCP", "NewInternalClient": "$client", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43120, "NewInternalPort": 43120}, "expect": {"status": 200}}
          - {"kind": "soap", "action": "DeletePortMappingRange", "args": {"NewStartPort": 43120, "NewEndPort": 43120, "NewProtocol": "UDP", "NewManage": 0}, "expect": {"status": 200}}
          - {"kind": "soap", "action": "GetSpecificPortMappingEntry", "args": {"NewRemoteHost": "", "NewExternalPort": 43120, "NewProtocol": "TCP"}, "expect": {"status": 200}}
        cleanup:
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43120, "NewProtocol": "TCP"}}
      - name: wanipc2-2.5.19-must-scpd-deleteportmappingrange
        ref: "WANIPC2 §2.5.19"
        builds: ["igd2"]
        description: "The SCPD gives DeletePortMappingRange its arguments, in order."
        steps:
          - {"kind": "http", "path": "/WANIPCn.xml", "parse": "scpd", "expect": {"scpd.args.DeletePortMappingRange": ["NewStartPort", "NewEndPort", "NewProtocol", "NewManage"], "scpd.directions.DeletePortMappingRange": ["in", "in", "in", "in"]}}
      - name: wanipc2-2.5.21-must-getlistofportmappings
        ref: "WANIPC2 §2.5.21"
        families: [ipv4]
        builds: [igd2]
        description: GetListOfPortMappings returns a PortMappingList document (§2.3.25) with the mapping in the range.
        steps:
          - {kind: soap, action: AddPortMapping, args: {<<: *add_args, NewExternalPort: 43040, NewInternalPort: 43040}, expect: {status: 200}}
          - kind: soap
            action: GetListOfPortMappings
            args: {NewStartPort: 43040, NewEndPort: 43049, NewProtocol: UDP, NewManage: 0, NewNumberOfPorts: 10}
            expect: {status: 200, out.NewPortListing: {contains: ["PortMappingList", "PortMappingEntry", "43040"]}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43040, NewProtocol: UDP}}
      - name: wanipc2-2.5.21-must-getlistofportmappings-empty
        # spec gap: answers 200 for a range without mappings
        ref: "WANIPC2 §2.5.21"
        families: [ipv4]
        builds: [igd2]
        description: A range without mappings gets 730 PortMappingNotFound.
        steps:
          - {kind: soap, action: GetListOfPortMappings,
             args: {NewStartPort: 43050, NewEndPort: 43059, NewProtocol: UDP, NewManage: 0, NewNumberOfPorts: 10},
             expect: {status: 500, fault: 730}}
      - name: wanipc2-2.5.21-must-getlistofportmappings-inconsistent
        ref: "WANIPC2 §2.5.21"
        families: [ipv4]
        builds: [igd2]
        description: A start port above the end port gets 733 InconsistentParameters.
        steps:
          - {kind: soap, action: GetListOfPortMappings,
             args: {NewStartPort: 43059, NewEndPort: 43050, NewProtocol: UDP, NewManage: 0, NewNumberOfPorts: 10},
             expect: {status: 500, fault: 733}}
      - name: wanipc2-2.5.21-must-manage-0-own-only
        # spec gap: out.NewPortListing '<p:PortMappingList xmlns:p="urn:schemas-upnp-org:gw:WANIPConnection" xmlns:xsi="http://www
        ref: "WANIPC2 §2.5.21"
        families: ["ipv4"]
        builds: ["igd2"]
        requires: ["second-client"]
        description: "NewManage 0 lists only the mappings of the caller."
        steps:
          - {"kind": "soap", "client": "second", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "UDP", "NewInternalClient": "$client2", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43103, "NewInternalPort": 43103}, "expect": {"status": 200}}
          - {"kind": "soap", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "UDP", "NewInternalClient": "$client", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43104, "NewInternalPort": 43104}, "expect": {"status": 200}}
          - {"kind": "soap", "action": "GetListOfPortMappings", "args": {"NewStartPort": 43103, "NewEndPort": 43104, "NewProtocol": "UDP", "NewManage": 0, "NewNumberOfPorts": 10}, "expect": {"status": 200, "out.NewPortListing": {"not_contains": "43103"}}}
        cleanup:
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43103, "NewProtocol": "UDP"}, "client": "second"}
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43104, "NewProtocol": "UDP"}}
      - name: wanipc2-2.5.21-must-bad-protocol
        # spec gap: status was 200, expected 500
        ref: "WANIPC2 §2.5.21"
        families: ["ipv4"]
        builds: ["igd2"]
        description: "A bad NewProtocol gets 601."
        steps:
          - {"kind": "soap", "action": "GetListOfPortMappings", "args": {"NewStartPort": 43115, "NewEndPort": 43116, "NewProtocol": "ICMP", "NewManage": 0, "NewNumberOfPorts": 10}, "expect": {"status": 500, "fault": 601}}
      - name: wanipc2-2.5.21-must-number-of-ports-zero
        ref: "WANIPC2 §2.5.21"
        families: ["ipv4"]
        builds: ["igd2"]
        description: "NewNumberOfPorts 0 returns all mappings of the range."
        steps:
          - {"kind": "soap", "action": "AddPortMapping", "args": {"NewRemoteHost": "", "NewProtocol": "UDP", "NewInternalClient": "$client", "NewEnabled": 1, "NewPortMappingDescription": "upnp-wire", "NewLeaseDuration": 3600, "NewExternalPort": 43121, "NewInternalPort": 43121}, "expect": {"status": 200}}
          - {"kind": "soap", "action": "GetListOfPortMappings", "args": {"NewStartPort": 43121, "NewEndPort": 43121, "NewProtocol": "UDP", "NewManage": 0, "NewNumberOfPorts": 0}, "expect": {"status": 200, "out.NewPortListing": {"contains": "43121"}}}
        cleanup:
          - {"kind": "soap", "action": "DeletePortMapping", "args": {"NewRemoteHost": "", "NewExternalPort": 43121, "NewProtocol": "UDP"}}
      - name: wanipc2-2.5.21-must-scpd-getlistofportmappings
        ref: "WANIPC2 §2.5.21"
        builds: ["igd2"]
        description: "The SCPD gives GetListOfPortMappings its arguments, in order."
        steps:
          - {"kind": "http", "path": "/WANIPCn.xml", "parse": "scpd", "expect": {"scpd.args.GetListOfPortMappings": ["NewStartPort", "NewEndPort", "NewProtocol", "NewManage", "NewNumberOfPorts", "NewPortListing"], "scpd.directions.GetListOfPortMappings": ["in", "in", "in", "in", "in", "out"]}}
      - name: soap11-3-must-wrong-body-namespace
        # spec gap: status unexpectedly equals 200
        ref: "SOAP11 §3"
        families: ["ipv4"]
        description: "A Body in a foreign namespace is refused."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><x:Body xmlns:x=\"urn:x\"><u:{action} xmlns:u=\"{service_type}\"/></x:Body></s:Envelope>", "expect": {"status": {"not_equals": 200}}}
      - name: soap11-3-must-other-envelope-prefix
        ref: "SOAP11 §3"
        families: ["ipv4"]
        description: "The SOAP namespace is honoured by URI, not by prefix."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><E:Envelope xmlns:E=\"http://schemas.xmlsoap.org/soap/envelope/\" E:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><E:Body><u:{action} xmlns:u=\"{service_type}\"/></E:Body></E:Envelope>", "expect": {"status": 200, "out.NewExternalIPAddress": {"present": true}}}
      - name: soap11-3-must-billion-laughs
        # spec gap: status unexpectedly equals 200
        ref: "SOAP11 §3"
        families: ["ipv4"]
        description: "A body with nested entities is refused, not expanded."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><!DOCTYPE l [<!ENTITY a \"aaaaaaaaaa\"><!ENTITY b \"&a;&a;&a;&a;&a;&a;&a;&a;&a;&a;\"><!ENTITY c \"&b;&b;&b;&b;&b;&b;&b;&b;&b;&b;\"><!ENTITY d \"&c;&c;&c;&c;&c;&c;&c;&c;&c;&c;\">]><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:{action} xmlns:u=\"{service_type}\"><x>&d;</x></u:{action}></s:Body></s:Envelope>", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: soap11-3-must-external-entity
        # spec gap: status unexpectedly equals 200
        ref: "SOAP11 §3"
        families: ["ipv4"]
        description: "An external entity is not read."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><!DOCTYPE r [<!ENTITY x SYSTEM \"file:///etc/passwd\">]><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:{action} xmlns:u=\"{service_type}\"><x>&x;</x></u:{action}></s:Body></s:Envelope>", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: soap11-4-must-no-envelope
        # spec gap: status unexpectedly equals 200
        ref: "SOAP11 §4"
        families: ["ipv4"]
        description: "A well-formed body whose top element is not Envelope is refused."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><u:{action} xmlns:u=\"{service_type}\"/>", "expect": {"status": {"not_equals": 200}}}
      - name: soap11-4-must-empty-body
        # spec gap: status unexpectedly equals 200
        ref: "SOAP11 §4"
        families: ["ipv4"]
        description: "A POST with an empty body is refused."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "", "expect": {"status": {"not_equals": 200}}}
      - name: soap11-4-must-no-body
        # spec gap: status unexpectedly equals 200
        ref: "SOAP11 §4"
        families: ["ipv4"]
        description: "An Envelope without a Body is refused."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"></s:Envelope>", "expect": {"status": {"not_equals": 200}}}
      - name: soap11-4-must-nested-body
        # spec gap: status unexpectedly equals 200
        ref: "SOAP11 §4"
        families: ["ipv4"]
        description: "A Body that is not a child of Envelope is refused."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><x:W xmlns:x=\"urn:x\"><s:Body><u:{action} xmlns:u=\"{service_type}\"/></s:Body></x:W></s:Envelope>", "expect": {"status": {"not_equals": 200}}}
      - name: soap11-4-must-header-after-body
        # spec gap: status unexpectedly equals 200
        ref: "SOAP11 §4"
        families: ["ipv4"]
        description: "A Header after the Body is refused."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:{action} xmlns:u=\"{service_type}\"/></s:Body><s:Header/></s:Envelope>", "expect": {"status": {"not_equals": 200}}}
      - name: soap11-4-must-body-only-whitespace
        # spec gap: status unexpectedly equals 200
        ref: "SOAP11 §4"
        families: ["ipv4"]
        description: "A body of spaces is refused."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "   \r\n   ", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: soap11-4.2.2-must-other-actor-not-targeted
        ref: "SOAP11 §4.2.2"
        families: ["ipv4"]
        description: "A mandatory header for another actor does not stop the action."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Header><x:Unknown xmlns:x=\"urn:example:unknown\" s:mustUnderstand=\"1\" s:actor=\"urn:example:other\"/></s:Header><s:Body><u:{action} xmlns:u=\"{service_type}\"/></s:Body></s:Envelope>", "expect": {"status": 200, "out.NewExternalIPAddress": {"present": true}}}
      - name: soap11-4.2.3-must-unknown-mandatory-header
        # spec gap: status was 200, expected 500
        ref: "SOAP11 §4.2.3"
        families: ["ipv4"]
        description: "An unknown header with mustUnderstand 1 gets a MustUnderstand fault."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Header><x:Unknown xmlns:x=\"urn:example:unknown\" s:mustUnderstand=\"1\"/></s:Header><s:Body><u:{action} xmlns:u=\"{service_type}\"/></s:Body></s:Envelope>", "expect": {"status": 500, "body": {"contains": "MustUnderstand"}}}

  - name: WANCommonInterfaceConfig and Layer3Forwarding
    description: The read-only WAN interface service (WANCIC1) and the default connection service (L3F1).
    cases:
      - name: uda11-3.2.5-must-wancic-unknown-action
        ref: "UDA-1.1 §3.2.5"
        families: [ipv4]
        description: An action WANCommonInterfaceConfig does not have gets 401.
        steps:
          - {kind: soap, service: WANCommonInterfaceConfig, action: NoSuchAction,
             expect: {status: 500, fault: 401}}
      - name: wancic1-2.2-must-scpd-state-variables
        ref: "WANCIC1 §2.2"
        description: "The SCPD has the required variables with their types."
        steps:
          - {"kind": "http", "path": "/WANCfg.xml", "parse": "scpd", "expect": {"scpd.type.WANAccessType": "string", "scpd.type.Layer1UpstreamMaxBitRate": "ui4", "scpd.type.Layer1DownstreamMaxBitRate": "ui4", "scpd.type.PhysicalLinkStatus": "string", "scpd.allowed.PhysicalLinkStatus": {"contains": ["Up", "Down"]}}}
      - name: wancic1-2.4.3-must-getcommonlinkproperties
        ref: "WANCIC1 §2.4.3"
        description: GetCommonLinkProperties returns the access type, the link rates and PhysicalLinkStatus.
        steps:
          - kind: soap
            service: WANCommonInterfaceConfig
            action: GetCommonLinkProperties
            expect: {status: 200, out.NewWANAccessType: {one_of: [DSL, POTS, Cable, Ethernet]},
                     out.NewLayer1UpstreamMaxBitRate: {matches: "^[0-9]+$"},
                     out.NewLayer1DownstreamMaxBitRate: {matches: "^[0-9]+$"},
                     out.NewPhysicalLinkStatus: {one_of: [Up, Down, Initializing, Unavailable]}}
      - name: wancic1-2.4.3-must-stray-argument
        # spec gap: status was 200, expected 500
        ref: "WANCIC1 §2.4.3"
        families: ["ipv4"]
        description: "GetCommonLinkProperties with an IN argument gets 402."
        steps:
          - {"kind": "soap", "service": "WANCommonInterfaceConfig", "action": "GetCommonLinkProperties", "args": {"Extra": "x"}, "expect": {"status": 500, "fault": 402}}
      - name: wancic1-2.4.3-must-scpd-getcommonlinkproperties
        ref: "WANCIC1 §2.4.3"
        description: "The SCPD gives GetCommonLinkProperties its arguments, in order."
        steps:
          - {"kind": "http", "path": "/WANCfg.xml", "parse": "scpd", "expect": {"scpd.args.GetCommonLinkProperties": ["NewWANAccessType", "NewLayer1UpstreamMaxBitRate", "NewLayer1DownstreamMaxBitRate", "NewPhysicalLinkStatus"], "scpd.directions.GetCommonLinkProperties": ["out", "out", "out", "out"]}}
      - name: wancic1-2.4.6-may-gettotalbytessent
        ref: "WANCIC1 §2.4.6"
        families: [ipv4]
        description: GetTotalBytesSent returns a ui4 counter.
        steps:
          - {kind: soap, service: WANCommonInterfaceConfig, action: GetTotalBytesSent,
             expect: {status: 200, out.NewTotalBytesSent: {matches: "^[0-9]+$"}}}
      - name: wancic1-2.4.7-may-gettotalbytesreceived
        ref: "WANCIC1 §2.4.7"
        families: [ipv4]
        description: GetTotalBytesReceived returns a ui4 counter.
        steps:
          - {kind: soap, service: WANCommonInterfaceConfig, action: GetTotalBytesReceived,
             expect: {status: 200, out.NewTotalBytesReceived: {matches: "^[0-9]+$"}}}
      - name: wancic1-2.4.8-may-gettotalpacketssent
        ref: "WANCIC1 §2.4.8"
        families: [ipv4]
        description: GetTotalPacketsSent returns a ui4 counter.
        steps:
          - {kind: soap, service: WANCommonInterfaceConfig, action: GetTotalPacketsSent,
             expect: {status: 200, out.NewTotalPacketsSent: {matches: "^[0-9]+$"}}}
      - name: wancic1-2.4.9-may-gettotalpacketsreceived
        ref: "WANCIC1 §2.4.9"
        families: [ipv4]
        description: GetTotalPacketsReceived returns a ui4 counter.
        steps:
          - {kind: soap, service: WANCommonInterfaceConfig, action: GetTotalPacketsReceived,
             expect: {status: 200, out.NewTotalPacketsReceived: {matches: "^[0-9]+$"}}}
      - name: l3f1-2.4.1-must-setdefaultconnectionservice-unknown-device
        requires: [strict]
        ref: "L3F1 §2.4.1"
        families: [ipv4]
        description: SetDefaultConnectionService with a device UUID the gateway does not have gets 720
          InvalidDeviceUUID.
        steps:
          - kind: soap
            service: Layer3Forwarding
            action: SetDefaultConnectionService
            args: {NewDefaultConnectionService: "uuid:00000000-0000-0000-0000-000000000000:WANConnectionDevice:1,urn:upnp-org:serviceId:WANIPConn1"}
            expect: {status: 500, fault: 720}
      - name: l3f1-2.4.1-must-set-then-get
        ref: "L3F1 §2.4.1"
        families: ["ipv4"]
        description: "A Set with the current value succeeds and Get returns it."
        steps:
          - {"kind": "soap", "service": "Layer3Forwarding", "action": "GetDefaultConnectionService", "capture": {"cur": "out.NewDefaultConnectionService"}, "expect": {"status": 200}}
          - {"kind": "soap", "service": "Layer3Forwarding", "action": "SetDefaultConnectionService", "args": {"NewDefaultConnectionService": "$cur"}, "expect": {"status": 200}}
          - {"kind": "soap", "service": "Layer3Forwarding", "action": "GetDefaultConnectionService", "capture": {}, "expect": {"status": 200, "out.NewDefaultConnectionService": "$cur"}}
      - name: l3f1-2.4.1-must-set-missing-argument
        ref: "L3F1 §2.4.1"
        families: ["ipv4"]
        description: "A Set without an argument gets 402."
        steps:
          - {"kind": "soap", "service": "Layer3Forwarding", "action": "SetDefaultConnectionService", "args": {}, "expect": {"status": 500, "fault": 402}}
      - name: l3f1-2.4.1-must-set-wrong-argument-name
        ref: "L3F1 §2.4.1"
        families: ["ipv4"]
        description: "A Set with another argument name gets 402."
        steps:
          - {"kind": "soap", "service": "Layer3Forwarding", "action": "SetDefaultConnectionService", "args": {"Other": "x"}, "expect": {"status": 500, "fault": 402}}
      - name: l3f1-2.4.1-must-set-too-many-arguments
        # spec gap: status was 200, expected 500
        ref: "L3F1 §2.4.1"
        families: ["ipv4"]
        description: "A Set with an extra argument gets 402."
        steps:
          - {"kind": "soap", "service": "Layer3Forwarding", "action": "GetDefaultConnectionService", "capture": {"cur": "out.NewDefaultConnectionService"}, "expect": {"status": 200}}
          - {"kind": "soap", "service": "Layer3Forwarding", "action": "SetDefaultConnectionService", "args": {"NewDefaultConnectionService": "$cur", "Extra": "x"}, "expect": {"status": 500, "fault": 402}}
      - name: l3f1-2.4.1-must-scpd-setdefaultconnectionservice
        ref: "L3F1 §2.4.1"
        description: "The SCPD gives SetDefaultConnectionService its arguments, in order."
        steps:
          - {"kind": "http", "path": "/L3F.xml", "parse": "scpd", "expect": {"scpd.args.SetDefaultConnectionService": ["NewDefaultConnectionService"], "scpd.directions.SetDefaultConnectionService": ["in"]}}
      - name: l3f1-2.4.2-must-getdefaultconnectionservice
        ref: "L3F1 §2.4.2"
        description: GetDefaultConnectionService names the WANIPConnection service of the WANConnectionDevice.
        steps:
          - kind: soap
            service: Layer3Forwarding
            action: GetDefaultConnectionService
            expect: {status: 200, out.NewDefaultConnectionService: {matches: "^uuid:[^:]+:WANConnectionDevice:[12],urn:upnp-org:serviceId:WANIPConn1$"}}
      - name: l3f1-2.4.2-must-get-extra-argument
        # spec gap: status was 200, expected 500
        ref: "L3F1 §2.4.2"
        families: ["ipv4"]
        description: "A Get with an IN argument gets 402."
        steps:
          - {"kind": "soap", "service": "Layer3Forwarding", "action": "GetDefaultConnectionService", "args": {"Extra": "x"}, "expect": {"status": 500, "fault": 402}}
      - name: l3f1-2.4.2-must-scpd-getdefaultconnectionservice
        ref: "L3F1 §2.4.2"
        description: "The SCPD gives GetDefaultConnectionService its arguments, in order."
        steps:
          - {"kind": "http", "path": "/L3F.xml", "parse": "scpd", "expect": {"scpd.args.GetDefaultConnectionService": ["NewDefaultConnectionService"], "scpd.directions.GetDefaultConnectionService": ["out"]}}

  - name: WANIPv6FirewallControl
    description: IPv6 pinholes over SOAP (6FC1, IGDv2 built with IPv6) from this client, their faults and
      the secure-mode check of InternalClient.
    cases:
      - name: uda11-3.2.5-must-addpinhole-bad-protocol
        # spec gap: a Protocol that is not a number is read as 0 and answered 705 ProtocolNotSupported
        ref: "UDA-1.1 §3.2.5"
        builds: [igd2]
        families: [ipv6]
        description: A Protocol that is not a ui2 gets 402 Invalid Args.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole, args: {<<: *pinhole_args, Protocol: abc, InternalPort: 44009},
             expect: {status: 500, fault: 402}}
      - name: 6fc1-2.4.8-must-addpinhole-lease-zero
        ref: "6FC1 §2.4.8"
        builds: [igd2]
        families: [ipv6]
        description: LeaseTime 0 is below the allowed range 1-86400 and is refused (402 / 601).
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole, args: {<<: *pinhole_args, InternalPort: 44006, LeaseTime: 0},
             capture: {id: out.UniqueID}, expect: {status: 500, fault: {one_of: [402, 601]}}}
        cleanup:
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: $id}}
      - name: 6fc1-2.4.8-must-addpinhole-lease-over-max
        ref: "6FC1 §2.4.8"
        builds: [igd2]
        families: [ipv6]
        description: LeaseTime 86401 is above the allowed range and is refused (402 / 601).
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole, args: {<<: *pinhole_args, InternalPort: 44007, LeaseTime: 86401},
             capture: {id: out.UniqueID}, expect: {status: 500, fault: {one_of: [402, 601]}}}
        cleanup:
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: $id}}
      - name: 6fc1-2.4.8-must-lease-boundaries
        ref: "6FC1 §2.4.8"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "LeaseTime 1 and 86400 are accepted."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": 0, "InternalClient": "$client", "Protocol": 17, "LeaseTime": 1, "InternalPort": 44101}, "expect": {"status": 200}, "capture": {"a": "out.UniqueID"}}
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": 0, "InternalClient": "$client", "Protocol": 17, "LeaseTime": 86400, "InternalPort": 44102}, "expect": {"status": 200}, "capture": {"b": "out.UniqueID"}}
        cleanup:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "DeletePinhole", "args": {"UniqueID": "$a"}, "expect": {}}
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "DeletePinhole", "args": {"UniqueID": "$b"}, "expect": {}}
      - name: 6fc1-2.4.8-must-updatepinhole-lease-range
        ref: "6FC1 §2.4.8"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "UpdatePinhole refuses a NewLeaseTime outside 1 to 86400."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": 0, "InternalClient": "$client", "Protocol": 17, "LeaseTime": 3600, "InternalPort": 44103}, "expect": {"status": 200}, "capture": {"a": "out.UniqueID"}}
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "UpdatePinhole", "args": {"UniqueID": "$a", "NewLeaseTime": 86401}, "expect": {"status": 500, "fault": {"one_of": [402, 601]}}}
        cleanup:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "DeletePinhole", "args": {"UniqueID": "$a"}, "expect": {}}
      - name: 6fc1-2.4.8-must-scpd-lease-range
        ref: "6FC1 §2.4.8"
        builds: ["igd2"]
        description: "The SCPD gives LeaseTime the range 1 to 86400."
        steps:
          - {"kind": "http", "path": "/WANIP6FC.xml", "parse": "scpd", "expect": {"scpd.range.A_ARG_TYPE_LeaseTime": ["1", "86400"]}}
      - name: 6fc1-2.4.9-must-uniqueid-distinct
        ref: "6FC1 §2.4.9"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "Different pinholes get different UniqueIDs."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": 0, "InternalClient": "$client", "Protocol": 17, "LeaseTime": 3600, "InternalPort": 44104}, "expect": {"status": 200}, "capture": {"a": "out.UniqueID"}}
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": 0, "InternalClient": "$client", "Protocol": 17, "LeaseTime": 3600, "InternalPort": 44105}, "expect": {"status": 200, "out.UniqueID": {"not_equals": "$a"}}, "capture": {"b": "out.UniqueID"}}
        cleanup:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "DeletePinhole", "args": {"UniqueID": "$a"}, "expect": {}}
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "DeletePinhole", "args": {"UniqueID": "$b"}, "expect": {}}
      - name: 6fc1-2.6.1-must-getfirewallstatus
        ref: "6FC1 §2.6.1"
        builds: [igd2]
        description: GetFirewallStatus returns FirewallEnabled and InboundPinholeAllowed 1.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: GetFirewallStatus,
             expect: {status: 200, out.FirewallEnabled: "1", out.InboundPinholeAllowed: "1"}}
      - name: 6fc1-2.6.1-must-scpd-getfirewallstatus
        ref: "6FC1 §2.6.1"
        builds: ["igd2"]
        description: "The SCPD gives GetFirewallStatus its arguments, in order."
        steps:
          - {"kind": "http", "path": "/WANIP6FC.xml", "parse": "scpd", "expect": {"scpd.args.GetFirewallStatus": ["FirewallEnabled", "InboundPinholeAllowed"], "scpd.directions.GetFirewallStatus": ["out", "out"]}}
      - name: 6fc1-2.6.2-may-getoutboundpinholetimeout
        known_failure: "not implemented: the handler in upnpsoap.c is a stub (r = -1), an optional action of 6FC1"
        ref: "6FC1 §2.6.2"
        builds: [igd2]
        families: [ipv6]
        description: GetOutboundPinholeTimeout returns a timeout (or 602, the action is optional).
        steps:
          - kind: soap
            service: WANIPv6FirewallControl
            action: GetOutboundPinholeTimeout
            args: {RemoteHost: "", RemotePort: 0, InternalClient: $client, InternalPort: 44000, Protocol: 17}
            expect: {fault: {one_of: [null, 602]}}
      - name: 6fc1-2.6.3-should-addpinhole-well-known-port
        ref: "6FC1 §2.6.3"
        builds: [igd2]
        families: [ipv6]
        description: IGD2 RECOMMENDS that an unauthenticated control point only opens InternalPort 1024 and up
          (606 for port 80).
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole, args: {<<: *pinhole_args, InternalPort: 80},
             capture: {id: out.UniqueID}, expect: {status: 500, fault: 606}}
        cleanup:
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: $id}}
      - name: 6fc1-2.6.3-must-pinhole-lifecycle
        ref: "6FC1 §2.6.3"
        builds: [igd2]
        families: [ipv6]
        description: AddPinhole returns a UniqueID, and GetPinholePackets, UpdatePinhole and DeletePinhole use it.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole, args: {<<: *pinhole_args, InternalPort: 44001},
             capture: {id: out.UniqueID}, expect: {status: 200, out.UniqueID: {matches: "^[0-9]+$"}}}
          - {kind: soap, service: WANIPv6FirewallControl, action: GetPinholePackets, args: {UniqueID: $id},
             expect: {status: 200, out.PinholePackets: {matches: "^[0-9]+$"}}}
          - {kind: soap, service: WANIPv6FirewallControl, action: UpdatePinhole, args: {UniqueID: $id, NewLeaseTime: 7200},
             expect: {status: 200}}
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: $id}, expect: {status: 200}}
        cleanup:
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: $id}}
      - name: 6fc1-2.6.3-must-addpinhole-again-same-id
        ref: "6FC1 §2.6.3"
        builds: [igd2]
        families: [ipv6]
        description: AddPinhole of an existing pinhole with another LeaseTime extends it and MUST return the
          same UniqueID.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole, args: {<<: *pinhole_args, InternalPort: 44003},
             capture: {id: out.UniqueID}, expect: {status: 200}}
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole,
             args: {<<: *pinhole_args, InternalPort: 44003, LeaseTime: 7200}, expect: {status: 200, out.UniqueID: $id}}
        cleanup:
          - {kind: soap, service: WANIPv6FirewallControl, action: DeletePinhole, args: {UniqueID: $id}}
      - name: 6fc1-2.6.3-should-addpinhole-other-client
        ref: "6FC1 §2.6.3"
        builds: [igd2]
        families: [ipv6]
        description: A pinhole for another InternalClient than the sender is refused with 606.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole,
             args: {<<: *pinhole_args, InternalClient: "@LAN6@99", InternalPort: 44004}, expect: {status: 500, fault: 606}}
      - name: 6fc1-2.6.3-impl-addpinhole-from-ipv4
        ref: "6FC1 §2.6.3"
        builds: [igd2]
        families: [ipv4]
        description: A pinhole requested over IPv4 for this client's IPv6 address cannot be authorized (606).
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole,
             args: {<<: *pinhole_args, InternalClient: "@LAN6@2", InternalPort: 44005}, expect: {status: 500, fault: 606}}
      - name: 6fc1-2.6.3-must-addpinhole-empty-internal-client
        ref: "6FC1 §2.6.3"
        builds: [igd2]
        families: [ipv6]
        description: An empty InternalClient (a wildcard) gets 708 WildCardNotPermittedInSrcIP.
        steps:
          - {kind: soap, service: WANIPv6FirewallControl, action: AddPinhole, args: {<<: *pinhole_args, InternalClient: "", InternalPort: 44008},
             expect: {status: 500, fault: 708}}
      - name: 6fc1-2.6.3-must-gateway-client
        ref: "6FC1 §2.6.3"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "InternalClient cannot be an address of the gateway."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": 0, "InternalClient": "$router", "Protocol": 17, "LeaseTime": 3600, "InternalPort": 44106}, "expect": {"status": 500}}
      - name: 6fc1-2.6.3-must-internal-port-wildcard
        ref: "6FC1 §2.6.3"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "A refused InternalPort wildcard gets 706."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": 0, "InternalClient": "$client", "Protocol": 17, "LeaseTime": 3600, "InternalPort": 0}, "expect": {"fault": {"one_of": [null, 706]}}}
      - name: 6fc1-2.6.3-must-protocol-not-supported
        ref: "6FC1 §2.6.3"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "An unsupported protocol gets 705."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": 0, "InternalClient": "$client", "Protocol": 200, "LeaseTime": 3600, "InternalPort": 44107}, "expect": {"status": 500, "fault": 705}}
      - name: 6fc1-2.6.3-must-internal-port-value-1
        # spec gap: status was 200, expected 500
        ref: "6FC1 §2.6.3"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "InternalPort '-1' is refused."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": 0, "InternalClient": "$client", "Protocol": 17, "LeaseTime": 3600, "InternalPort": "-1"}, "expect": {"status": 500}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: 6fc1-2.6.3-must-remote-port-value-1
        # spec gap: status was 200, expected 500
        ref: "6FC1 §2.6.3"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "RemotePort '-1' is refused."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": "-1", "InternalClient": "$client", "Protocol": 17, "LeaseTime": 3600, "InternalPort": 44200}, "expect": {"status": 500}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: 6fc1-2.6.3-must-internal-port-value-65536
        ref: "6FC1 §2.6.3"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "InternalPort '65536' is refused."
        steps:
