          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: 6fc1-2.6.3-must-internal-port-value-abc
        ref: "6FC1 §2.6.3"
        families: ["ipv6"]
        builds: ["igd2"]
        description: "InternalPort 'abc' is refused."
        steps:
          - {"kind": "soap", "service": "WANIPv6FirewallControl", "action": "AddPinhole", "args": {"RemoteHost": "", "RemotePort": 0, "InternalClient": "$client", "Protocol": 17, "LeaseTime": 3600, "InternalPort": "abc"}, "expect": {"status": 500}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: 6fc1-2.6.3-must-remote-port-value-abc
