/a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></s:Body></s:Envelope>", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-2.1-impl-long-action-name
        # spec gap: status unexpectedly equals 200
        ref: "UDA-1.1 §2.1"
        families: ["ipv4"]
        description: "A 4096-byte action element is refused."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u: xmlns:u=\"{service_type}\"/></s:Body></s:Envelope>", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-2.1-must-unterminated-attribute
        # spec gap: status unexpectedly equals 200
        ref: "UDA-1.1 §2.1"
        families: ["ipv4"]
        description: "An unterminated attribute is refused."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:{action} xmlns:u=\"{service_type}</s:Body></s:Envelope>", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-2.5.5-must-v1-service-type-on-v2
        ref: "UDA-1.1 §2.5.5"
        families: [ipv4]
        builds: [igd2]
        description: WANIPConnection:2 accepts a request for WANIPConnection:1 (a later version is backward
          compatible).
        steps:
          - {kind: soap, action: GetExternalIPAddress, service_type: "urn:schemas-upnp-org:service:WANIPConnection:1",
             expect: {status: 200}}
      - name: uda11-3.1.1-must-unknown-header-ignored
        ref: "UDA-1.1 §3.1.1"
        families: ["ipv4"]
        description: "An unknown Header entry without mustUnderstand does not stop the action."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Header><x:Unknown xmlns:x=\"urn:example:unknown\"/></s:Header><s:Body><u:{action} xmlns:u=\"{service_type}\"/></s:Body></s:Envelope>", "expect": {"status": 200, "out.NewExternalIPAddress": {"present": true}}}
      - name: uda11-3.1.1-must-no-encodingstyle
        ref: "UDA-1.1 §3.1.1"
        families: ["ipv4"]
        description: "A request without encodingStyle is accepted."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\"><s:Body><u:{action} xmlns:u=\"{service_type}\"/></s:Body></s:Envelope>", "expect": {"status": 200, "out.NewExternalIPAddress": {"present": true}}}
      - name: uda11-3.2.1-must-missing-soapaction
        ref: "UDA-1.1 §3.2.1"
        families: [ipv4]
        description: A control request without the REQUIRED SOAPACTION header is not executed.
        steps:
          - {kind: soap, action: GetExternalIPAddress, soapaction: false, expect: {status: {not_equals: 200}}}
      - name: uda11-3.2.1-may-ipv6-transport
        ref: "UDA-1.1 §3.2.1"
        families: [ipv6]
        description: Control over IPv6 works (GetExternalIPAddress).
        steps:
          - {kind: soap, action: GetExternalIPAddress, expect: {status: 200, out.NewExternalIPAddress: "198.51.100.1"}}
      - name: uda11-3.2.1-must-wrong-envelope-namespace
        # spec gap: answers 200: the namespace of the Envelope is not checked
        ref: "UDA-1.1 §3.2.1"
        families: [ipv4]
        description: An Envelope in another namespace than the SOAP one MUST get a fault.
        steps:
          - kind: soap
            action: GetExternalIPAddress
            raw_body: "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://example.com/not-soap\"><s:Body><u:{action} xmlns:u=\"{service_type}\"/></s:Body></s:Envelope>"
            expect: {status: 500, body: {contains: "Fault>"}}
      - name: uda11-3.2.1-must-other-namespace-prefixes
        ref: "UDA-1.1 §3.2.1"
        families: ["ipv4"]
        description: "Other legal namespace prefixes are accepted."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><q:{action} xmlns:q=\"{service_type}\"/></s:Body></s:Envelope>", "expect": {"status": 200, "out.NewExternalIPAddress": {"present": true}}}
      - name: uda11-3.2.1-must-comments-ignored
        ref: "UDA-1.1 §3.2.1"
        families: ["ipv4"]
        description: "XML comments in a request are ignored."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><!-- c --><s:Body><u:{action} xmlns:u=\"{service_type}\"/></s:Body></s:Envelope>", "expect": {"status": 200, "out.NewExternalIPAddress": {"present": true}}}
      - name: uda11-3.2.1-must-unknown-elements-ignored
        ref: "UDA-1.1 §3.2.1"
        families: ["ipv4"]
        description: "Unknown elements in a request are ignored."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:{action} xmlns:u=\"{service_type}\"><x:E xmlns:x=\"urn:x\"/></u:{action}></s:Body></s:Envelope>", "expect": {"status": 200, "out.NewExternalIPAddress": {"present": true}}}
      - name: uda11-3.2.1-must-unsupported-content-type-415
        # spec gap: status was 200, expected 415
        ref: "UDA-1.1 §3.2.1"
        families: ["ipv4"]
        description: "A CONTENT-TYPE other than text/xml gets 415."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "raw_body": "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:{action} xmlns:u=\"{service_type}\"/></s:Body></s:Envelope>", "expect": {"status": 415}, "headers": {"Content-Type": "text/plain"}}
      - name: uda11-3.2.1-must-action-name-case
        ref: "UDA-1.1 §3.2.1"
        families: ["ipv4"]
        description: "Element names are case sensitive: another case is not that action."
        steps:
          - {"kind": "soap", "action": "getExternalIPAddress", "expect": {"status": 500, "fault": 401}}
      - name: uda11-3.2.1-must-soapaction-no-hash
        ref: "UDA-1.1 §3.2.1"
        families: ["ipv4"]
        description: "A malformed SOAPACTION is not executed."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "soapaction": "\"urn:schemas-upnp-org:service:WANIPConnection:1\"", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-3.2.1-must-soapaction-unquoted
        # spec gap: status unexpectedly equals 200
        ref: "UDA-1.1 §3.2.1"
        families: ["ipv4"]
        description: "A malformed SOAPACTION is not executed."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "soapaction": "urn:schemas-upnp-org:service:WANIPConnection:1#GetExternalIPAddress", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-3.2.1-must-soapaction-empty
        ref: "UDA-1.1 §3.2.1"
        families: ["ipv4"]
        description: "A malformed SOAPACTION is not executed."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "soapaction": "\"\"", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-3.2.1-must-soapaction-hash-only
        ref: "UDA-1.1 §3.2.1"
        families: ["ipv4"]
        description: "A malformed SOAPACTION is not executed."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "soapaction": "\"#\"", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-3.2.1-must-soapaction-long
        # spec gap: status unexpectedly equals 200
        ref: "UDA-1.1 §3.2.1"
        families: ["ipv4"]
        description: "A malformed SOAPACTION is not executed."
        steps:
          - {"kind": "soap", "action": "GetExternalIPAddress", "soapaction": "\"#GetExternalIPAddress\"", "expect": {"status": {"not_equals": 200}}}
          - {"kind": "soap", "action": "GetExternalIPAddress", "expect": {"status": 200}}
      - name: uda11-3.2.2-must-response-headers
        ref: "UDA-1.1 §3.2.2"
        families: [ipv4]
        description: An action response has CONTENT-TYPE text/xml; charset="utf-8", EXT and SERVER.
        steps:
          - kind: http
            method: POST
            path: /ctl/IPConn
            headers: {Content-Type: "text/xml; charset=\"utf-8\"", SOAPAction: "\"urn:schemas-upnp-org:service:WANIPConnection:1#GetExternalIPAddress\""}
            body: "<?xml version=\"1.0\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:GetExternalIPAddress xmlns:u=\"urn:schemas-upnp-org:service:WANIPConnection:1\"/></s:Body></s:Envelope>"
            expect: {status: 200, header.content-type: {matches: "^text/xml; *charset=\"?utf-8\"?$"},
                     header.ext: {present: true}, header.server: {matches: " UPnP/1\\.1 "}}
      - name: uda11-3.2.2-must-http10-version
        ref: "UDA-1.1 §3.2.2"
        families: ["ipv4"]
        description: "A control response follows the HTTP version of the request."
        steps:
          - {"kind": "http", "raw": "POST /ctl/IPConn HTTP/1.0\r\nHost: {host}\r\nContent-Type: text/xml; charset=\"utf-8\"\r\nSOAPAction: \"urn:schemas-upnp-org:service:WANIPConnection:1#GetExternalIPAddress\"\r\nContent-Length: 0\r\n\r\n", "timeout": 2, "expect": {"version": "HTTP/1.0"}}
      - name: uda11-3.2.5-must-soapaction-other-service
        # spec gap: executes it: the service type of SOAPAction is not checked against the service of the control URL
        ref: "UDA-1.1 §3.2.5"
        families: [ipv4]
        description: A SOAPACTION naming another service type than the control URL's is refused (401).
        steps:
          - {kind: soap, action: GetExternalIPAddress, soapaction: '"urn:schemas-upnp-org:service:Layer3Forwarding:1#GetExternalIPAddress"',
             expect: {status: 500, fault: 401}}
      - name: uda11-3.2.5-must-v2-service-type-on-v1
        # spec gap: executes it: the service version of SOAPAction is not checked
        ref: "UDA-1.1 §3.2.5"
        families: [ipv4]
        builds: [igd1]
        description: WANIPConnection:1 refuses a request for WANIPConnection:2, a version it does not implement.
        steps:
          - {kind: soap, action: GetExternalIPAddress, service_type: "urn:schemas-upnp-org:service:WANIPConnection:2",
             expect: {status: 500, fault: 401}}
      - name: uda11-3.2.5-must-v2-action-on-igdv1
        # spec gap: executes AddAnyPortMapping: ExecuteSoapAction() (upnpsoap.c) looks the action up in one table for every service and version
        ref: "UDA-1.1 §3.2.5"
        families: [ipv4]
        builds: [igd1]
        description: AddAnyPortMapping, an action WANIPConnection:1 does not have, gets 401 Invalid Action.
        steps:
          - {kind: soap, action: AddAnyPortMapping, args: {<<: *add_args, NewExternalPort: 43017, NewInternalPort: 43017},
             expect: {status: 500, fault: 401}}
        cleanup:
          - {kind: soap, action: DeletePortMapping, args: {NewRemoteHost: "", NewExternalPort: 43017, NewProtocol: UDP}}
      - name: uda11-3.2.5-must-unknown-action
        ref: "UDA-1.1 §3.2.5"
        description: An action the service does not have gets 401 Invalid Action.
        steps:
          - {kind: soap, action: NoSuchAction, expect: {status: 500, fault: 401}}
      - name: uda11-3.2.5-must-action-of-another-service
        # spec gap: executes it: ExecuteSoapAction() (upnpsoap.c) looks the action up in one table for every service
        ref: "UDA-1.1 §3.2.5"
        families: [ipv4]
        description: GetExternalIPAddress (a WANIPConnection action) sent to WANCommonInterfaceConfig gets 401.
        steps:
          - {kind: soap, service: WANCommonInterfaceConfig, action: GetExternalIPAddress, expect: {status: 500, fault: 401}}
      - name: uda11-3.2.5-must-missing-argument
